<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ЕГЭ Тренажёр</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Arial,
                sans-serif;

            color: #111827;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(80, 170, 255, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(30, 110, 230, 0.25),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #eef7ff,
                    #dceeff,
                    #f7fbff,
                    #d9ecff
                );

            background-size: 180% 180%;

            animation: backgroundMove 14s ease-in-out infinite;
        }

        @keyframes backgroundMove {

            0% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 100%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 55vw;
            height: 55vw;

            max-width: 420px;
            max-height: 420px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.25);

            filter: blur(45px);

            pointer-events: none;

            animation: floatingBlob 12s ease-in-out infinite;
        }

        body::before {
            top: -15%;
            left: -10%;
        }

        body::after {
            right: -15%;
            bottom: -10%;

            animation-delay: -6s;
        }

        @keyframes floatingBlob {

            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, 20px) scale(1.15);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }


        /* =========================
           ОБЩИЙ ЭКРАН
        ========================= */

        .screen {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            padding:
                calc(env(safe-area-inset-top) + 20px)
                18px
                calc(env(safe-area-inset-bottom) + 20px);

            overflow: hidden;

            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transform: translate3d(22px, 0, 0) scale(0.985);
            filter: blur(7px);

            transition:
                opacity 420ms cubic-bezier(0.22, 1, 0.36, 1),
                transform 620ms cubic-bezier(0.22, 1, 0.36, 1),
                filter 420ms cubic-bezier(0.22, 1, 0.36, 1);

            will-change: opacity, transform, filter;
        }

        .screen.active {
            visibility: visible;
            pointer-events: auto;
            opacity: 1;
            transform: translate3d(0, 0, 0) scale(1);
            filter: blur(0);
            z-index: 2;
        }

        /*
           Переходы в стиле iOS / Liquid Glass:
           новый экран мягко приходит с нужной стороны,
           а старый слегка отходит назад и теряет резкость.
        */
        .screen.transition-forward {
            transform: translate3d(28px, 0, 0) scale(0.982);
        }

        .screen.transition-back {
            transform: translate3d(28px, 0, 0) scale(0.982);
        }

        .screen.leaving-forward {
            opacity: 0;
            transform: translate3d(-18px, 0, 0) scale(0.985);
            filter: blur(5px);
            pointer-events: none;
            z-index: 1;
        }

        .screen.leaving-back {
            opacity: 0;
            transform: translate3d(-18px, 0, 0) scale(0.985);
            filter: blur(5px);
            pointer-events: none;
            z-index: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            .screen {
                transition: opacity 180ms ease;
                transform: none !important;
                filter: none !important;
            }
        }


        /* =========================
           HOME
        ========================= */

        #homeScreen {
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .home-content {
            width: min(90vw, 420px);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .home-title {
            font-size: clamp(30px, 9vw, 46px);
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .home-subtitle {
            font-size: 16px;
            line-height: 1.45;

            max-width: 330px;

            color: rgba(17, 24, 39, 0.65);
        }


        /* =========================
           GLASS BUTTON
        ========================= */

        .glass-button {
            border: 1px solid rgba(255, 255, 255, 0.8);

            background: rgba(255, 255, 255, 0.48);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 12px 35px rgba(30, 100, 200, 0.12),
                inset 0 1px 2px rgba(255, 255, 255, 0.95);

            color: #111827;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .glass-button:active {
            transform: scale(0.96);

            background: rgba(255, 255, 255, 0.68);

            box-shadow:
                0 5px 18px rgba(30, 100, 200, 0.1),
                inset 0 1px 2px rgba(255, 255, 255, 1);
        }

        .start-button {
            width: min(86vw, 350px);
            min-height: 64px;

            padding: 15px 25px;

            border-radius: 22px;

            font-size: 18px;
            font-weight: 700;
        }


        /* =========================
           TOP BACK BUTTON
        ========================= */

        .back-button {
            position: absolute;

            top: calc(env(safe-area-inset-top) + 14px);
            left: 16px;

            width: 42px;
            height: 42px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
            font-weight: 400;

            z-index: 20;
        }


        /* =========================
           TOPICS
        ========================= */

        #topicsScreen {
            align-items: center;
        }

        .topics-title {
            margin-top: 60px;
            margin-bottom: 25px;

            font-size: 28px;
            font-weight: 800;
        }

        .topics-list {
            width: min(92vw, 430px);

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .topic-button {
            position: relative;

            width: 100%;
            min-height: 65px;

            padding: 12px 17px;

            border-radius: 19px;

            display: flex;
            align-items: center;

            text-align: left;

            font-size: 16px;
            font-weight: 650;
        }

        .topic-button.disabled {
            opacity: 0.42;
            cursor: default;
        }

        .topic-button .soon {
            margin-left: auto;

            font-size: 11px;
            font-weight: 700;

            padding: 5px 8px;

            border-radius: 8px;

            background: rgba(100, 116, 139, 0.12);
            color: #64748b;
        }


        /* =========================
           TRAINING
        ========================= */

        #trainingScreen {
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 0;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            position: absolute;

            top: calc(env(safe-area-inset-top) + 14px);
            left: 50%;

            transform: translateX(-50%);

            width: min(78vw, 320px);

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            gap: 5px;

            z-index: 10;
        }

        .stat {
            height: 34px;

            padding: 0 6px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            font-size: 10px;
            font-weight: 650;

            white-space: nowrap;

            border: 1px solid rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 7px 18px rgba(30, 100, 200, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.85);
        }

        .stat.correct {
            color: #16803c;
            background: rgba(220, 252, 231, 0.58);
        }

        .stat.wrong {
            color: #dc2626;
            background: rgba(254, 226, 226, 0.58);
        }

        .stat.total {
            color: #64748b;
            background: rgba(241, 245, 249, 0.58);
        }


        /* =========================
           TRAINING TOP
        ========================= */

        .training-top {
            position: relative;

            height: 50%;

            min-height: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding:
                75px
                20px
                15px;
        }

        .word-area {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            min-height: 130px;

            text-align: center;
        }

        .word {
            font-size: clamp(38px, 11vw, 58px);

            font-weight: 800;

            letter-spacing: -1px;

            color: #111827;

            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word .missing {
            display: inline-block;

            min-width: 0.6em;

            color: #2563eb;
        }


        /* =========================
           RESULT
        ========================= */

        .result {
            margin-top: 12px;

            display: flex;
            flex-direction: column;

            align-items: center;

            min-height: 54px;

            text-align: center;
        }

        .result-label {
            font-size: 12px;
            font-weight: 600;

            color: rgba(17, 24, 39, 0.55);

            line-height: 1.3;
        }

        .result-word {
            margin-top: 3px;

            font-size: 16px;
            font-weight: 700;

            line-height: 1.3;
        }

        .result.correct-result .result-word {
            color: #16803c;
        }

        .result.wrong-result .result-word {
            color: #dc2626;
        }


        /* =========================
           ANSWER AREA
        ========================= */

        .training-bottom {
            height: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                10px
                20px
                calc(env(safe-area-inset-bottom) + 25px);
        }

        .answer-buttons {
            width: min(78vw, 310px);

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 16px;
        }

        .answer-buttons.three-buttons {
            grid-template-columns: repeat(3, 1fr);
        }

        .word-note {
            display: block;
            margin-top: 8px;
            font-size: 0.42em;
            line-height: 1.15;
            font-weight: 500;
            opacity: 0.75;
        }

        .result-word-note {
            display: block;
            margin-top: 4px;
            font-size: 0.72em;
            font-weight: 500;
            opacity: 0.8;
        }

        .answer-button {
            width: 100%;
            aspect-ratio: 1 / 1;

            border-radius: 25px;

            font-size: clamp(36px, 11vw, 58px);
            font-weight: 750;

            display: flex;
            align-items: center;
            justify-content: center;

            user-select: none;

            transition:
                transform 0.12s ease,
                background 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .answer-button:active {
            transform: scale(0.94);
        }

        .answer-button.correct-answer {
            background: rgba(187, 247, 208, 0.75);
            border-color: rgba(34, 197, 94, 0.7);

            color: #15803d;

            box-shadow:
                0 12px 30px rgba(34, 197, 94, 0.15),
                inset 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        .answer-button.wrong-answer {
            background: rgba(254, 202, 202, 0.78);
            border-color: rgba(239, 68, 68, 0.7);

            color: #dc2626;

            box-shadow:
                0 12px 30px rgba(239, 68, 68, 0.15),
                inset 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        .answer-button.disabled {
            pointer-events: none;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        .fade-in {
            animation: fadeIn 0.22s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pop {
            animation: pop 0.18s ease;
        }

        @keyframes pop {

            0% {
                transform: scale(0.92);
            }

            70% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-height: 650px) {

            .training-top {
                padding-top: 65px;
            }

            .word {
                font-size: 38px;
            }

            .answer-buttons {
                width: min(65vw, 240px);
                gap: 12px;
            }

            .answer-button {
                border-radius: 20px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         HOME
    ========================= -->

    <section
        id="homeScreen"
        class="screen active"
    >

        <div class="home-content">

            <div class="home-title">
                БаллUP
            </div>

            <div class="home-subtitle">
                Тренажёр для подготовки к экзамену
            </div>

            <button
                class="glass-button start-button"
                id="startTrainingButton"
            >
                📚 Начать тренировку
            </button>

        </div>

    </section>



    <!-- =========================
         TOPICS
    ========================= -->

    <section
        id="topicsScreen"
        class="screen"
    >

        <button
            class="glass-button back-button"
            id="topicsBackButton"
            aria-label="Назад"
        >
            &lt;
        </button>


        <div class="topics-title">
            Темы
        </div>


        <div class="topics-list">

            <button
                class="glass-button topic-button"
                id="prePriTopic"
            >
                📚 Приставка ПРЕ- и ПРИ-
            </button>


            <button
                class="glass-button topic-button"
                id="dictionaryTopic"
            >
                📖 Словарные слова
            </button>


            <button
                class="glass-button topic-button disabled"
                disabled
            >
                📝 Ударения

                <span class="soon">
                    Скоро
                </span>
            </button>


            <button
                class="glass-button topic-button disabled"
                disabled
            >
                🔤 Правописание НЕ

                <span class="soon">
                    Скоро
                </span>
            </button>


            <button
                class="glass-button topic-button disabled"
                disabled
            >
                📖 Лексические нормы

                <span class="soon">
                    Скоро
                </span>
            </button>


            <button
                class="glass-button topic-button disabled"
                disabled
            >
                ✏️ Грамматические нормы

                <span class="soon">
                    Скоро
                </span>
            </button>

        </div>

    </section>



    <!-- =========================
         TRAINING
    ========================= -->

    <section
        id="trainingScreen"
        class="screen"
    >


        <button
            class="glass-button back-button"
            id="trainingBackButton"
            aria-label="Назад"
        >
            &lt;
        </button>


        <!-- СЧЁТЧИК -->

        <div class="stats">

            <div
                class="stat correct"
                id="correctStat"
            >
                Верно: 0
            </div>

            <div
                class="stat wrong"
                id="wrongStat"
            >
                Неверно: 0
            </div>

            <div
                class="stat total"
                id="totalStat"
            >
                Всего: 0
            </div>

        </div>


        <!-- ВЕРХ -->

        <div class="training-top">

            <div
                class="word-area"
                id="wordArea"
            >

                <div
                    class="word"
                    id="word"
                >
                    пр_красный
                </div>


                <div
                    class="result"
                    id="result"
                >

                    <div
                        class="result-label"
                        id="resultLabel"
                    ></div>

                    <div
                        class="result-word"
                        id="resultWord"
                    ></div>

                </div>

            </div>

        </div>


        <!-- НИЗ -->

        <div class="training-bottom">

            <div class="answer-buttons">

                <button
                    class="glass-button answer-button"
                    data-letter="е"
                    id="buttonE"
                >
                    Е
                </button>

                <button
                    class="glass-button answer-button"
                    data-letter="и"
                    id="buttonI"
                >
                    И
                </button>

                <button
                    class="glass-button answer-button"
                    data-letter=""
                    id="buttonThird"
                    aria-label="пусто"
                ></button>

            </div>

        </div>

    </section>



<script>

    /* =========================================================
       TELEGRAM
    ========================================================= */

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /* =========================================================
       BACKEND
       
       ПОКА ОСТАВЛЯЕМ ЗАГЛУШКУ.
       
       Когда сделаем backend, сюда поставим его адрес:
       
       const API_URL = "https://example.com/wrong-answer";
       
       ========================================================= */

    const API_URL = "";


    /* =========================================================
       СЛОВА
       ========================================================= */

    const words = [
        {
            "task_id": "prepri_0001",
            "before": "пр",
            "after": "амбула",
            "correct": "е",
            "full": "преамбула"
        },
        {
            "task_id": "prepri_0002",
            "before": "пр",
            "after": "подавать",
            "correct": "е",
            "full": "преподавать"
        },
        {
            "task_id": "prepri_0003",
            "before": "пр",
            "after": "мат",
            "correct": "и",
            "full": "примат"
        },
        {
            "task_id": "prepri_0004",
            "before": "пр",
            "after": "фект",
            "correct": "е",
            "full": "префект"
        }
    ];


    const dictionaryWords = [
        {
            "task_id": "dictionary_0001",
            "before": "аб",
            "after": "жур",
            "correct": "а",
            "full": "абажур",
            "options": [
                "а",
                "о"
            ],
            "note": ""
        },
        {
            "task_id": "dictionary_0002",
            "before": "вакх",
            "after": "налия",
            "correct": "а",
            "full": "вакханалия",
            "options": [
                "а",
                "о"
            ],
            "note": ""
        },
        {
            "task_id": "dictionary_0003",
            "before": "анаф",
            "after": "ра",
            "correct": "о",
            "full": "анафора",
            "options": [
                "о",
                "а"
            ],
            "note": ""
        },
        {
            "task_id": "dictionary_0004",
            "before": "бук",
            "after": "нист",
            "correct": "и",
            "full": "букинист",
            "options": [
                "и",
                "е"
            ],
            "note": ""
        }
    ];

    /* =========================================================
       СОСТОЯНИЕ ТРЕНИРОВКИ
       ========================================================= */

    let correctCount = 0;

    let wrongCount = 0;

    /*
       Слова, которые ещё не были правильно решены.
    */

    let activeWords = [];


    /*
       Очередь отложенных слов.

       Каждый объект:

       {
           word: слово,
           delay: сколько других слов
                  нужно пройти перед возвратом
       }
    */

    let delayedWords = [];


    let currentWord = null;

    // true, если текущее задание уже было ошибочным раньше
    let currentWordWasPreviouslyWrong = false;

    let currentWordSet = words;

    let answerLocked = false;

    let currentRoundNumber = 0;

    /* =========================================================
       СОХРАНЕНИЕ ПРОГРЕССА
       ========================================================= */

    const PROGRESS_STORAGE_KEY = "egeTrainerProgress_v1";
    let currentTopicKey = null;
    let resumeAfterAnswer = false;

    // Управление встряской активно только внутри тренировки.
    // Встряска вправо/влево выбирает соответствующий вариант ответа.
    let isTrainingActive = false;
    let shakeListenerAttached = false;
    let lastShakeTime = 0;
    const SHAKE_THRESHOLD = 12;
    const SHAKE_COOLDOWN = 700;

    // Двойное нажатие по свободному месту тренировки запускает новый цикл.
    let lastFreeTapTime = 0;
    let lastFreeTapX = 0;
    let lastFreeTapY = 0;
    const DOUBLE_TAP_DELAY = 350;
    const DOUBLE_TAP_DISTANCE = 45;

    const topicKeys = new Map([
        [words, "prePri"],
        [dictionaryWords, "dictionary"]
    ]);

    function getWordIndex(wordSet, word) {
        return wordSet.indexOf(word);
    }

    function saveProgress() {
        if (!currentTopicKey) {
            return;
        }

        try {
            const state = {
                topic: currentTopicKey,
                correctCount,
                wrongCount,
                currentRoundNumber,
                activeWords: activeWords.map(word => getWordIndex(currentWordSet, word)),
                delayedWords: delayedWords.map(item => ({
                    index: getWordIndex(currentWordSet, item.word),
                    delay: item.delay
                })),
                currentWordIndex: currentWord
                    ? getWordIndex(currentWordSet, currentWord)
                    : -1,
                currentWordWasPreviouslyWrong,
                resumeAfterAnswer
            };

            /*
               Прогресс хранится отдельно для каждой темы.
               Поэтому переход в другую тему больше не затирает
               состояние предыдущей.
            */
            let allProgress = {};
            const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);

            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === "object") {
                        if (parsed.topics && typeof parsed.topics === "object") {
                            allProgress = parsed.topics;
                        } else if (parsed.topic) {
                            // Миграция старого формата, где хранилась только одна тема.
                            allProgress[parsed.topic] = parsed;
                        }
                    }
                } catch (parseError) {
                    console.warn("Не удалось прочитать сохранённый прогресс:", parseError);
                }
            }

            allProgress[currentTopicKey] = state;

            localStorage.setItem(
                PROGRESS_STORAGE_KEY,
                JSON.stringify({
                    version: 2,
                    topics: allProgress
                })
            );
        } catch (error) {
            console.warn("Не удалось сохранить прогресс:", error);
        }
    }

    function loadProgress(topicKey) {
        try {
            const raw = localStorage.getItem(PROGRESS_STORAGE_KEY);

            if (!raw) {
                return null;
            }

            const parsed = JSON.parse(raw);
            let state = null;

            if (
                parsed &&
                parsed.topics &&
                typeof parsed.topics === "object"
            ) {
                state = parsed.topics[topicKey] || null;
            } else if (
                parsed &&
                parsed.topic === topicKey
            ) {
                // Поддержка старого формата одного сохранённого состояния.
                state = parsed;
            }

            if (!state) {
                return null;
            }

            const wordSet = topicKey === "dictionary"
                ? dictionaryWords
                : words;

            const restoreWord = index =>
                Number.isInteger(index) &&
                index >= 0 &&
                index < wordSet.length
                    ? wordSet[index]
                    : null;

            const restoredActiveWords =
                Array.isArray(state.activeWords)
                    ? state.activeWords
                        .map(restoreWord)
                        .filter(Boolean)
                    : [];

            const restoredDelayedWords =
                Array.isArray(state.delayedWords)
                    ? state.delayedWords
                        .map(item => ({
                            word: restoreWord(item.index),
                            delay: Number(item.delay)
                        }))
                        .filter(item =>
                            item.word &&
                            Number.isFinite(item.delay)
                        )
                    : [];

            const restoredCurrentWord =
                restoreWord(state.currentWordIndex);

            if (
                restoredActiveWords.length === 0 &&
                restoredDelayedWords.length === 0 &&
                !restoredCurrentWord
            ) {
                return null;
            }

            return {
                wordSet,
                correctCount: Number(state.correctCount) || 0,
                wrongCount: Number(state.wrongCount) || 0,
                currentRoundNumber: Number(state.currentRoundNumber) || 0,
                activeWords: restoredActiveWords,
                delayedWords: restoredDelayedWords,
                currentWord: restoredCurrentWord,
                currentWordWasPreviouslyWrong: Boolean(state.currentWordWasPreviouslyWrong),
                resumeAfterAnswer: Boolean(state.resumeAfterAnswer)
            };
        } catch (error) {
            console.warn("Не удалось загрузить прогресс:", error);
            return null;
        }
    }

    function clearProgress() {
        try {
            localStorage.removeItem(PROGRESS_STORAGE_KEY);
        } catch (error) {
            console.warn("Не удалось удалить прогресс:", error);
        }
    }

    /* =========================================================

    let activeScreen = document.querySelector(".screen.active") || homeScreen;
    let screenTransitionTimer = null;

    function showScreen(screen) {

        if (!screen || screen === activeScreen) {
            return;
        }

        const screens = [
            homeScreen,
            topicsScreen,
            trainingScreen
        ];

        const oldScreen = activeScreen;
        const oldIndex = screens.indexOf(oldScreen);
        const newIndex = screens.indexOf(screen);
        const goingForward = newIndex > oldIndex;

        if (screenTransitionTimer) {
            clearTimeout(screenTransitionTimer);
        }

        document
            .querySelectorAll(".screen")
            .forEach(item => {
                item.classList.remove(
                    "active",
                    "transition-forward",
                    "transition-back",
                    "leaving-forward",
                    "leaving-back"
                );
            });

        // Сначала ставим новый экран в стартовую позицию.
        screen.classList.add(
            goingForward
                ? "transition-forward"
                : "transition-back"
        );

        // Затем одним кадром запускаем плавную spring-анимацию.
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                screen.classList.remove(
                    "transition-forward",
                    "transition-back"
                );
                screen.classList.add("active");

                if (oldScreen) {
                    oldScreen.classList.add(
                        goingForward
                            ? "leaving-forward"
                            : "leaving-back"
                    );
                }
            });
        });

        activeScreen = screen;

        screenTransitionTimer = setTimeout(() => {
            if (oldScreen && oldScreen !== activeScreen) {
                oldScreen.classList.remove(
                    "active",
                    "leaving-forward",
                    "leaving-back"
                );
            }
            screenTransitionTimer = null;
        }, 680);
    }

    /* =========================================================
       ВСТРЯСКА ТЕЛЕФОНА → НОВЫЙ ЦИКЛ
       ========================================================= */

    function resetCurrentTopicCycleByShake() {

        if (!isTrainingActive || !currentTopicKey) {
            return;
        }

        if (completedTopicResetTimer) {
            clearTimeout(completedTopicResetTimer);
            completedTopicResetTimer = null;
        }

        currentWordSet =
            currentTopicKey === "dictionary"
                ? dictionaryWords
                : words;

        activeWords = [...currentWordSet];
        delayedWords = [];
        currentWord = null;
        currentWordWasPreviouslyWrong = false;
        currentRoundNumber = 0;
        correctCount = 0;
        wrongCount = 0;
        resumeAfterAnswer = false;
        answerLocked = false;

        shuffle(activeWords);
        saveProgress();
        updateStats();
        clearResult();
        resetButtons();

        // Если встряска произошла на экране тренировки — сразу показываем
        // первое слово нового цикла.
        if (activeScreen === trainingScreen) {
            nextWord();
        }
    }

    async function enableShakeDetection() {

        if (shakeListenerAttached || !isTrainingActive) {
            return;
        }

        // iOS требует явного разрешения на датчики движения.
        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function"
        ) {
            try {
                const permission = await DeviceMotionEvent.requestPermission();
                if (permission !== "granted") {
                    return;
                }
            } catch (error) {
                console.warn("Не удалось получить доступ к датчику движения", error);
                return;
            }
        }

        if (typeof DeviceMotionEvent === "undefined") {
            return;
        }

        window.addEventListener("devicemotion", handleDeviceMotion, { passive: true });
        shakeListenerAttached = true;
    }

    function triggerHaptic() {

        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred("medium");
            return;
        }

        if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") {
            navigator.vibrate([45, 35, 45]);
        }
    }


    function handleDeviceMotion(event) {

        if (!isTrainingActive || answerLocked || !currentWord) {
            return;
        }

        // Для выбора ответа нам важна именно горизонтальная составляющая.
        // acceleration предпочтительнее, чтобы гравитация не воспринималась
        // как встряска. Если её нет, используем accelerationIncludingGravity.
        const acceleration = event.acceleration || event.accelerationIncludingGravity;

        if (!acceleration) {
            return;
        }

        const x = Number(acceleration.x) || 0;
        const now = Date.now();

        if (Math.abs(x) < SHAKE_THRESHOLD) {
            return;
        }

        if (now - lastShakeTime < SHAKE_COOLDOWN) {
            return;
        }

        lastShakeTime = now;

        // Вправо выбирает правую кнопку, влево — левую.
        // Для текущего интерфейса это первые две доступные кнопки.
        const visibleButtons = answerButtons.filter(
            button => button.style.display !== "none"
        );

        if (visibleButtons.length < 2) {
            return;
        }

        const selectedButton = x > 0
            ? visibleButtons[0]
            : visibleButtons[1];

        const selectedLetter = selectedButton.dataset.letter;

        if (selectedLetter === undefined) {
            return;
        }

        triggerHaptic();
        checkAnswer(selectedLetter);
    }


    function handleTrainingFreeFieldTap(event) {

        if (!isTrainingActive) {
            return;
        }

        // Двойное нажатие по кнопкам не должно сбрасывать тренировку.
        if (event.target.closest("button, a, input, select, textarea, .answer-buttons")) {
            return;
        }

        const now = Date.now();
        const x = event.clientX || 0;
        const y = event.clientY || 0;
        const timeDelta = now - lastFreeTapTime;
        const distance = Math.hypot(x - lastFreeTapX, y - lastFreeTapY);

        if (timeDelta <= DOUBLE_TAP_DELAY && distance <= DOUBLE_TAP_DISTANCE) {
            lastFreeTapTime = 0;
            lastFreeTapX = 0;
            lastFreeTapY = 0;

            triggerHaptic();
            resetCurrentTopicCycleByShake();
            return;
        }

        lastFreeTapTime = now;
        lastFreeTapX = x;
        lastFreeTapY = y;
    }


    trainingScreen.addEventListener("pointerup", handleTrainingFreeFieldTap);


    /* =========================================================
       НАЧАЛО ТРЕНИРОВКИ
       ========================================================= */

    function startTraining(wordSet = words) {

        if (completedTopicResetTimer) {
            clearTimeout(completedTopicResetTimer);
            completedTopicResetTimer = null;
        }

        currentTopicKey = topicKeys.get(wordSet) || "prePri";
        isTrainingActive = true;
        enableShakeDetection();

        const saved = loadProgress(currentTopicKey);

        if (saved) {
            correctCount = saved.correctCount;
            wrongCount = saved.wrongCount;
            currentRoundNumber = saved.currentRoundNumber;
            currentWordSet = saved.wordSet;
            activeWords = saved.activeWords;
            delayedWords = saved.delayedWords;
            currentWord = saved.currentWord;
            currentWordWasPreviouslyWrong = saved.currentWordWasPreviouslyWrong;
            resumeAfterAnswer = saved.resumeAfterAnswer;
            answerLocked = false;

            /*
               При повторном открытии темы не показываем заново
               то же самое сохранённое слово.

               Если слово уже было ошибочным, оно уже находится
               в delayedWords и будет показано по правилам повтора.
               Если на нём ещё не отвечали, возвращаем его в activeWords,
               чтобы оно не потерялось, и выбираем следующее слово.
            */
            if (currentWord) {
                if (currentWordWasPreviouslyWrong) {
                    currentWord = null;
                } else {
                    const alreadyActive = activeWords.includes(currentWord);
                    const alreadyDelayed = delayedWords.some(
                        item => item.word === currentWord
                    );

                    if (!alreadyActive && !alreadyDelayed) {
                        activeWords.push(currentWord);
                    }

                    currentWord = null;
                }
            }

            currentWordWasPreviouslyWrong = false;
            resumeAfterAnswer = false;

            updateStats();
            showScreen(trainingScreen);
            nextWord();

            return;
        }

        correctCount = 0;

        wrongCount = 0;

        currentRoundNumber = 0;

        answerLocked = false;
        resumeAfterAnswer = false;


        /*
           Создаём независимую копию массива.

           Исходный набор слов никогда не изменяется.
        */

        currentWordSet = wordSet;
        activeWords = [...wordSet];

        delayedWords = [];

        currentWord = null;
        currentWordWasPreviouslyWrong = false;


        /*
           Перемешиваем все слова.
        */

        shuffle(activeWords);


        updateStats();

        showScreen(trainingScreen);

        nextWord();

    }


    /* =========================================================
       RANDOM SHUFFLE
       ========================================================= */

    function shuffle(array) {

        for (
            let i = array.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(Math.random() * (i + 1));

            [
                array[i],
                array[j]
            ] =
            [
                array[j],
                array[i]
            ];

        }

        return array;
    }


    /* =========================================================
       СЛУЧАЙНОЕ ЧИСЛО 10–20
       ========================================================= */

    function randomDelay() {

        return Math.floor(
            Math.random() * 11
        ) + 10;

    }


    /* =========================================================
       СЛЕДУЮЩЕЕ СЛОВО
       ========================================================= */

    function nextWord() {

        answerLocked = false;

        resetButtons();

        clearResult();


        /*
           Если больше нет активных слов
           и нет отложенных —
           тренировка закончена.
        */

        if (
            activeWords.length === 0 &&
            delayedWords.length === 0
        ) {

            finishTraining();

            return;

        }


        currentRoundNumber++;


        /*
           Если обычные задания закончились,
           переходим в режим повторения ошибок.

           В этом режиме показываем ТОЛЬКО те слова,
           на которых раньше была ошибка. Задержка
           между ними больше не нужна.
        */

        if (activeWords.length === 0 && delayedWords.length > 0) {

            /*
               Режим повторения только ошибок.

               Если ошибочных слов несколько, нельзя сразу
               показывать то же самое слово, на котором была
               только что допущена ошибка. Сначала формируем
               список всех других ошибочных слов и выбираем
               следующее случайно из него.

               Если ошибочное слово осталось всего одно,
               повторить именно его неизбежно — других вариантов
               просто нет.
            */
            let repeatCandidates = delayedWords;

            if (delayedWords.length > 1 && currentWord) {
                repeatCandidates = delayedWords.filter(
                    item => item.word !== currentWord
                );
            }

            const randomIndex = Math.floor(
                Math.random() * repeatCandidates.length
            );

            currentWord =
                repeatCandidates[randomIndex].word;

            currentWordWasPreviouslyWrong = true;

            renderWord(currentWord);
            updateStats();
            saveProgress();

            return;
        }


        /*
           Пока есть обычные задания,
           отложенные ошибки ждут своего повтора.
        */

        for (
            const item of delayedWords
        ) {

            item.delay--;

        }


        /*
           Слова, которым уже пора возвращаться.
        */

        const readyWords =
            delayedWords.filter(
                item => item.delay <= 0
            );


        /*
           ВАЖНО: готовое слово не удаляем из delayedWords до
           момента правильного ответа. Оно всё ещё считается
           нерешённым, поэтому должно входить в "Всего".
           После ошибки checkAnswer() заново поставит его
           в delayedWords с новой задержкой, а после правильного
           ответа removeFromDelayedWords() удалит его окончательно.
        */

        let selectedWord = null;


        /*
           Если есть слово, которое пора вернуть,
           выбираем одно случайное.
        */

        if (readyWords.length > 0) {

            const randomIndex =
                Math.floor(
                    Math.random() *
                    readyWords.length
                );

            selectedWord =
                readyWords[randomIndex].word;

            currentWordWasPreviouslyWrong = true;


            /*
               Все готовые слова уже остаются в delayedWords.
               Выбранное тоже остаётся там до ответа, чтобы
               "Всего" не уменьшалось просто из-за показа слова.
            */

        }


        /*
           Если готового слова нет,
           берём случайное из активных.
        */

        if (!selectedWord) {

            if (activeWords.length > 0) {

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        activeWords.length
                    );

                selectedWord =
                    activeWords[randomIndex];

                currentWordWasPreviouslyWrong = false;

            }

        }


        /*
           Теоретически selectedWord
           всегда должен существовать.
        */

        if (!selectedWord) {

            finishTraining();

            return;

        }


        currentWord = selectedWord;
        resumeAfterAnswer = false;

        renderWord(currentWord);
        saveProgress();

    }


    /* =========================================================
       ОТОБРАЖЕНИЕ СЛОВА
       ========================================================= */

    function renderWord(word) {

        wordElement.classList.remove("fade-in");

        void wordElement.offsetWidth;

        wordElement.classList.add("fade-in");

        wordElement.innerHTML =
            `<span class="word-main">${escapeHtml(word.before)}<span class="missing">_</span>${escapeHtml(word.after)}</span>` +
            (word.note
                ? `<span class="word-note">${escapeHtml(word.note)}</span>`
                : "");

        configureAnswerButtons(word.options);
    }


    function configureAnswerButtons(options) {

        const labels = options || ["е", "и"];

        answerButtonsContainer.classList.toggle(
            "three-buttons",
            labels.length === 3
        );

        answerButtons.forEach((button, index) => {

            const option = labels[index];

            button.classList.remove(
                "correct-answer",
                "wrong-answer",
                "disabled"
            );

            if (option === undefined) {
                button.style.display = "none";
                return;
            }

            button.style.display = "flex";
            button.dataset.letter = option;
            button.textContent = option === "" ? "" : option.toUpperCase();
            button.setAttribute(
                "aria-label",
                option === "" ? "пусто" : option.toUpperCase()
            );
        });
    }


    /* =========================================================
       ОТВЕТ
       ========================================================= */

    answerButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    if (answerLocked) {
                        return;
                    }

                    if (!currentWord) {
                        return;
                    }

                    const selectedLetter =
                        button.dataset.letter;

                    checkAnswer(
                        selectedLetter
                    );

                }
            );

        }
    );


    /* =========================================================
       ПРОВЕРКА
       ========================================================= */

    function checkAnswer(letter) {

        answerLocked = true;


        /*
           Сразу вставляем выбранную букву.
        */

        const visibleLetter =
            letter === "" || letter === "/"
                ? ""
                : letter;

        wordElement.innerHTML =
            `<span class="word-main">${escapeHtml(currentWord.before)}<span class="missing">${escapeHtml(visibleLetter)}</span>${escapeHtml(currentWord.after)}</span>` +
            (currentWord.note
                ? `<span class="word-note">${escapeHtml(currentWord.note)}</span>`
                : "");


        const isCorrect =
            letter === currentWord.correct;


        /*
           Находим кнопку правильного ответа.
        */

        const correctButton =
            answerButtons.find(
                button =>
                    button.dataset.letter ===
                    currentWord.correct
            );


        /*
           Находим выбранную кнопку.
        */

        const selectedButton =
            answerButtons.find(
                button =>
                    button.dataset.letter ===
                    letter
            );


        if (isCorrect) {

            /* =========================
               ПРАВИЛЬНО
            ========================= */

            // Сохраняем текущее задание до его удаления/обнуления.
            // Ниже это слово ещё нужно показать в результате.
            const solvedWord = currentWord;

            /*
               Если слово уже было ошибочным и сейчас
               решено правильно на повторе, счётчики
               "Верно" и "Неверно" НЕ меняются.
               Меняется только "Всего".
            */

            if (!currentWordWasPreviouslyWrong) {
                correctCount++;
            }


            selectedButton
                ?.classList.add(
                    "correct-answer"
                );


            /*
               Удаляем слово навсегда
               из текущего цикла.
            */

            removeFromActiveWords(
                currentWord
            );

            removeFromDelayedWords(
                currentWord
            );

            /*
               Теперь пересчитываем "Всего" уже ПОСЛЕ
               удаления задания. Поэтому число сразу
               уменьшается на 1.
            */
            updateStats();

            /*
               Сохраняем именно новое состояние.
               Старое currentWord больше не должно
               возвращаться при повторном открытии темы.
            */
            currentWord = null;
            currentWordWasPreviouslyWrong = false;
            resumeAfterAnswer = true;
            saveProgress();


            resultElement.className =
                "result correct-result";

            resultLabel.textContent =
                "✓ Правильно";

            resultWord.innerHTML =
                `${escapeHtml(solvedWord.full.replace(/ \([^)]*\)$/, ""))}` +
                (solvedWord.note
                    ? `<span class="result-word-note">${escapeHtml(solvedWord.note)}</span>`
                    : "");


            setTimeout(
                () => {

                    nextWord();

                },
                1000
            );

        } else {

            /* =========================
               ОШИБКА
            ========================= */

            /*
               Ошибка учитывается только один раз для задания.
               Если это повтор уже ошибочного слова,
               "Неверно" больше не увеличивается.
            */

            if (!currentWordWasPreviouslyWrong) {
                wrongCount++;
            }

            updateStats();


            selectedButton
                ?.classList.add(
                    "wrong-answer"
                );


            correctButton
                ?.classList.add(
                    "correct-answer"
                );


            resultElement.className =
                "result wrong-result";


            resultLabel.textContent =
                "правильное слово:";


            resultWord.innerHTML =
                `${escapeHtml(currentWord.full.replace(/ \([^)]*\)$/, ""))}` +
                (currentWord.note
                    ? `<span class="result-word-note">${escapeHtml(currentWord.note)}</span>`
                    : "");


            /*
               Слово остаётся незавершённым.

               Откладываем его на 10–20
               других слов.
            */

            /*
               Любая ошибка оставляет слово нерешённым.
               Для первого ошибочного ответа переносим его из
               activeWords в delayedWords. Для повторной ошибки
               слово могло быть временно выбрано из delayedWords,
               поэтому тоже заново ставим его в очередь с новой
               задержкой. Это не даёт слову исчезнуть из "Всего".
            */
            removeFromActiveWords(
                currentWord
            );

            removeFromDelayedWords(
                currentWord
            );

            delayedWords.push({
                word: currentWord,
                delay: randomDelay()
            });

            currentWordWasPreviouslyWrong = true;

            resumeAfterAnswer = true;
            saveProgress();


            /*
               Отправляем ошибку backend.
               
               Важно:
               fetch НЕ закрывает Mini App.
            */

            sendWrongAnswer(
                currentWord.full
            );


            /*
               Через одну секунду
               переходим дальше.
            */

            setTimeout(
                () => {

                    nextWord();

                },
                1000
            );

        }

    }


    /* =========================================================
       ОТПРАВКА ОШИБКИ BACKEND
       ========================================================= */

    async function sendWrongAnswer(word) {

        /*
           Если backend пока не указан —
           просто ничего не делаем.

           Само приложение продолжает работать.
        */

        if (!API_URL) {

            console.log(
                "Backend пока не подключён:",
                word
            );

            return;

        }


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            word: word,

                            /*
                               Telegram передаёт
                               подписанные initData.

                               Backend сможет проверить,
                               что запрос действительно
                               пришёл от Telegram.
                            */

                            initData:
                                tg.initData

                        })

                    }
                );


            if (!response.ok) {

                console.error(
                    "Backend error:",
                    response.status
                );

                return;

            }


            const data =
                await response.json();


            console.log(
                "Ошибка отправлена:",
                data
            );


        } catch (error) {

            console.error(
                "Не удалось отправить ошибку:",
                error
            );

        }

    }


    /* =========================================================
       УДАЛИТЬ ИЗ ACTIVE
    ========================================================= */

    function removeFromActiveWords(word) {

        activeWords =
            activeWords.filter(
                item =>
                    item !== word
            );

    }


    /* =========================================================
       УДАЛИТЬ ИЗ DELAYED
    ========================================================= */

    function removeFromDelayedWords(word) {

        delayedWords =
            delayedWords.filter(
                item =>
                    item.word !== word
            );

    }


    /* =========================================================
       СТАТИСТИКА
    ========================================================= */

    function updateStats() {

        correctStat.textContent =
            `Верно: ${correctCount}`;


        wrongStat.textContent =
            `Неверно: ${wrongCount}`;


        /*
           Всего =
           количество уникальных слов,
           которые ещё не были решены правильно.

           Поэтому при ошибке оно НЕ уменьшается.

           При правильном ответе уменьшается.
        */

        const remaining =
            activeWords.length +
            delayedWords.length;


        totalStat.textContent =
            `Всего: ${remaining}`;

    }


    /* =========================================================
       ВАЖНО:
       После изменения delayedWords
       статистику нужно обновить.
    ========================================================= */

    function updateRemainingStat() {

        const remaining =
            activeWords.length +
            delayedWords.length;

        totalStat.textContent =
            `Всего: ${remaining}`;

    }


    /* =========================================================
       РЕЗУЛЬТАТ
    ========================================================= */

    function clearResult() {

        resultElement.className =
            "result";

        resultLabel.textContent =
            "";

        resultWord.innerHTML =
            "";

    }


    /* =========================================================
       КНОПКИ
    ========================================================= */

    function resetButtons() {

        answerButtons.forEach(
            button => {

                button.classList.remove(
                    "correct-answer",
                    "wrong-answer",
                    "disabled"
                );

            }
        );

    }


    /* =========================================================
       ЗАВЕРШЕНИЕ
    ========================================================= */

    let completedTopicResetTimer = null;

    function finishTraining() {

        answerLocked = true;

        resetButtons();


        wordElement.textContent =
            "🎉";


        resultElement.className =
            "result correct-result";


        resultLabel.textContent =
            "Тренировка завершена";


        resultWord.textContent =
            `Верно: ${correctCount} • Неверно: ${wrongCount}`;


        updateStats();


        /*
           Если все задания темы решены правильно
           и осталось 0 заданий, через 5 секунд
           полностью восстанавливаем тему.
        */

        if (
            activeWords.length === 0 &&
            delayedWords.length === 0
        ) {

            if (completedTopicResetTimer) {
                clearTimeout(completedTopicResetTimer);
            }

            const completedTopicKey = currentTopicKey;

            completedTopicResetTimer = setTimeout(
                () => {

                    /*
                       Если пользователь уже перешёл
                       в другую тему, старый таймер
                       не должен менять её состояние.
                    */

                    if (currentTopicKey !== completedTopicKey) {
                        return;
                    }

                    currentWordSet =
                        completedTopicKey === "dictionary"
                            ? dictionaryWords
                            : words;

                    activeWords = [...currentWordSet];
                    delayedWords = [];
                    currentWord = null;
                    currentWordWasPreviouslyWrong = false;
                    currentRoundNumber = 0;
                    resumeAfterAnswer = false;
                    answerLocked = false;

                    // Новый цикл темы начинается с чистой статистикой.
                    correctCount = 0;
                    wrongCount = 0;

                    // Сохраняем уже сброшенное состояние, чтобы
                    // следующий запуск не вернул старые значения.
                    saveProgress();
                    updateStats();
                    nextWord();

                    completedTopicResetTimer = null;

                },
                5000
            );

        }

    }


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================================
       TELEGRAM THEME
    ========================================================= */

    if (
        tg.themeParams &&
        tg.themeParams.bg_color
    ) {

        /*
           Ничего специально не меняем:
           дизайн приложения остаётся
           синим/белым.
        */

    }


</script>
