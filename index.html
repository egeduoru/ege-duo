<script>
'use strict';
const cards=[{"title":"Магнитное поле","desc":"Определение · характеристики","emoji":"🧲","html":"<section class=\"qa\"><h3>Определение:</h3><p><strong>Магнитное поле</strong> — форма материи, создаваемая движущимися электрическими зарядами (токами), постоянными магнитами и изменяющимся электрическим полем. Оно действует на движущиеся заряды и проводники с током.</p></section><section class=\"qa\"><h3>Характеристики:</h3><p><strong>Главная силовая характеристика</strong> — вектор магнитной индукции <strong><span class=\"vec\">B</span></strong>. Он задаёт величину и направление магнитного поля в точке.</p><p>Магнитное поле бывает <strong>однородным</strong> (<span class=\"vec\">B</span> одинаков в каждой точке) и <strong>неоднородным</strong> (<span class=\"vec\">B</span> меняется от точки к точке).</p></section><section class=\"qa\"><h3>Как обнаружить:</h3><p>По действию на магнитную стрелку, проводник с током или движущуюся заряженную частицу.</p></section>"},{"title":"Магнитная индукция","desc":"Вектор B (вектор) и модуль B · формула · единицы","emoji":"🧭","html":"<section class=\"qa\"><h3>Определение:</h3><p><strong>Магнитная индукция</strong> — векторная физическая величина, характеризующая силовое действие магнитного поля.</p></section><section class=\"qa\"><h3>Вектор <span class=\"vec\">B</span>:</h3><p><strong><span class=\"vec\">B</span></strong> имеет модуль и направление. Его направление совпадает с направлением, в котором указывает <strong>северный полюс</strong> маленькой магнитной стрелки.</p></section><section class=\"qa\"><h3>Модуль B:</h3><p><strong>B = |<span class=\"vec\">B</span>|</strong> — числовое значение магнитной индукции. Чем больше B, тем сильнее поле действует на ток при одинаковых условиях.</p></section><section class=\"qa\"><h3>Формула:</h3><div class=\"formula\">B = F<sub>А</sub> / (I · ℓ · sin α)<small>Если проводник перпендикулярен полю (α = 90°): B = Fₐ/(I·ℓ).</small></div><p>F<sub>А</sub> — сила Ампера; I — ток; ℓ — длина проводника в поле; α — угол между направлением тока и <span class=\"vec\">B</span>.</p></section><section class=\"qa\"><h3>Единицы измерения:</h3><p><strong>Тесла (Тл)</strong>: 1 Тл = 1 Н/(А·м).</p></section>"},{"title":"Силовые линии","desc":"Определение · свойства · направление","emoji":"➿","html":"<section class=\"qa\"><h3>Определение:</h3><p><strong>Линии магнитной индукции</strong> — воображаемые линии, касательные к которым в каждой точке совпадают с направлением вектора <span class=\"vec\">B</span>.</p></section><section class=\"qa\"><h3>Свойства:</h3><ul><li>Не пересекаются.</li><li>Не имеют начала и конца; образуют замкнутые линии.</li><li>Чем гуще расположены линии, тем сильнее магнитное поле.</li><li>В однородном поле линии параллельны и расположены с одинаковой густотой.</li></ul></section><section class=\"qa\"><h3>Направление линий:</h3><p><strong>Снаружи постоянного магнита:</strong> от северного полюса <strong>N</strong> к южному <strong>S</strong>, внутри — от S к N. Вокруг прямого провода направление определяется <strong>правилом правой руки (буравчика)</strong>: большой палец по току, согнутые пальцы — по линиям B.</p><div class=\"note\">Обозначения на рисунках: <strong>•</strong> — <span class=\"vec\">B</span> к нам, из листа; <strong>×</strong> — <span class=\"vec\">B</span> от нас, в лист.</div></section>"},{"title":"Закон Ампера","desc":"Формулировка · формула · левая рука","emoji":"✋","html":"<section class=\"qa\"><h3>Определение силы Ампера:</h3><p><strong>Сила Ампера</strong> — сила, с которой магнитное поле действует на проводник с электрическим током.</p></section><section class=\"qa\"><h3>Формулировка:</h3><p>На проводник с током, помещённый в магнитное поле, действует <strong>сила Ампера</strong>. Её модуль пропорционален магнитной индукции, силе тока, длине проводника в поле и синусу угла между током и <span class=\"vec\">B</span>.</p></section><section class=\"qa\"><h3>Формула:</h3><div class=\"formula\">F<sub>А</sub> = B · I · ℓ · sin α</div><p>F<sub>А</sub> измеряется в ньютонах (Н). Если ток направлен вдоль <span class=\"vec\">B</span>, то α = 0° и <strong>F<sub>А</sub> = 0</strong>.</p></section><section class=\"qa\"><h3>Правило левой руки:</h3><p>Расположи <strong>левую ладонь</strong> так, чтобы линии <span class=\"vec\">B</span> входили в неё. Четыре вытянутых пальца направь <strong>по току I</strong>. Отогнутый большой палец покажет <strong>направление силы Ампера</strong>.</p></section>"},{"title":"Сила Лоренца","desc":"Определение · формулировка · формула · руки","emoji":"⚡","html":"<section class=\"qa\"><h3>Определение:</h3><p><strong>Сила Лоренца</strong> (магнитная составляющая) — сила, с которой магнитное поле действует на движущуюся заряженную частицу.</p></section><section class=\"qa\"><h3>Формулировка:</h3><p>Модуль силы пропорционален модулю заряда, скорости частицы, магнитной индукции и синусу угла между скоростью и <span class=\"vec\">B</span>. Сила перпендикулярна скорости и <span class=\"vec\">B</span>.</p></section><section class=\"qa\"><h3>Формула:</h3><div class=\"formula\">F<sub>Л</sub> = |q| · v · B · sin α</div><p>|q| — модуль заряда (Кл); v — скорость (м/с); B — индукция (Тл); α — угол между <span class=\"vec\">v</span> и <span class=\"vec\">B</span>.</p></section><section class=\"qa\"><h3>Положительная частица (+):</h3><p><strong>Левая рука:</strong> <span class=\"vec\">B</span> входит в ладонь, четыре пальца направлены по скорости <span class=\"vec\">v</span>, большой палец показывает силу <span class=\"vec\">F</span><sub>Л</sub>.</p></section><section class=\"qa\"><h3>Отрицательная частица (−):</h3><p><strong>Правая рука:</strong> <span class=\"vec\">B</span> входит в ладонь, четыре пальца направлены по скорости <span class=\"vec\">v</span>, большой палец показывает силу <span class=\"vec\">F</span><sub>Л</sub> для отрицательного заряда.</p></section><section class=\"qa\"><h3>Что делает сила:</h3><p>Меняет <strong>направление скорости</strong>, но магнитная сила не совершает работу и сама по себе не меняет кинетическую энергию частицы. При движении вдоль поля (α = 0°) сила равна нулю.</p></section>"},{"title":"Закон Ньютона и сила Лоренца","desc":"Определения Ньютона и Лоренца · вывод всех 6 формул","emoji":"🌀","html":"<section class=\"qa\"><h3>Определение силы Лоренца:</h3><p><strong>Сила Лоренца</strong> (её магнитная составляющая) — сила, действующая со стороны магнитного поля на движущуюся заряженную частицу. При движении перпендикулярно полю она изменяет направление скорости частицы.</p></section><section class=\"qa\"><h3>Определение второго закона Ньютона:</h3><p><strong>Второй закон Ньютона:</strong> ускорение тела прямо пропорционально равнодействующей сил, действующих на тело, и обратно пропорционально его массе; направление ускорения совпадает с направлением силы.</p><div class=\"formula\">F = m · a</div></section><section class=\"qa\"><h3>Условия:</h3><p>Частица с зарядом q движется в <strong>однородном</strong> магнитном поле; <strong><span class=\"vec\">v</span> ⟂ <span class=\"vec\">B</span></strong>; других сил нет. Скорость намного меньше скорости света. Траектория — окружность радиуса r.</p></section><section class=\"qa\"><h3>Определение центростремительного ускорения:</h3><p><strong>Центростремительное ускорение</strong> — ускорение тела при движении по окружности, направленное к её центру. Оно изменяет направление скорости, а не её модуль.</p><div class=\"formula\">a<sub>ц</sub> = v² / r</div></section><section class=\"qa\"><h3>Второй закон Ньютона:</h3><p><strong>Формулировка:</strong> равнодействующая сил равна произведению массы на ускорение. При движении по окружности сила направлена к центру.</p><div class=\"formula\">F = m · a<sub>ц</sub> = m · v² / r</div></section><section class=\"qa\"><h3>Сила Лоренца:</h3><p><strong>Формулировка:</strong> магнитная сила Лоренца действует на движущийся заряд. При <strong>v ⟂ B</strong> она направлена к центру окружности и играет роль центростремительной силы.</p><div class=\"formula\">F<sub>Л</sub> = |q| · v · B · sin α<br/>при α = 90°: F<sub>Л</sub> = |q| · v · B</div></section><section class=\"qa\"><h3>Вывод общего равенства:</h3><div class=\"formula\">|q| · v · B = m · v² / r</div><p>При v ≠ 0 сокращаем обе части на v и умножаем на r:</p><div class=\"formula\">|q| · B · r = m · v</div></section><section class=\"qa\"><h3>Формула радиуса:</h3><div class=\"formula\">r = m · v / (|q| · B)</div></section><section class=\"qa\"><h3>Формула скорости:</h3><div class=\"formula\">v = |q| · B · r / m</div></section><section class=\"qa\"><h3>Формула массы:</h3><div class=\"formula\">m = |q| · B · r / v</div></section><section class=\"qa\"><h3>Формула заряда:</h3><div class=\"formula\">|q| = m · v / (B · r)<small>Это модуль заряда; знак q определяют по направлению изгиба траектории.</small></div></section><section class=\"qa\"><h3>Формула магнитной индукции:</h3><div class=\"formula\">B = m · v / (|q| · r)</div></section><section class=\"qa\"><h3>Определение кинетической энергии:</h3><p><strong>Кинетическая энергия</strong> — энергия, которой обладает частица вследствие своего движения. В данном случае магнитная сила не меняет эту энергию, а только направление скорости.</p></section><section class=\"qa\"><h3>Формула энергии:</h3><div class=\"formula\">E<sub>к</sub> = m · v² / 2</div><p>Подставим <strong>v = |q|Br/m</strong>:</p><div class=\"formula\">E<sub>к</sub> = q² · B² · r² / (2m)</div></section><section class=\"qa\"><h3>Обозначения:</h3><p>m — масса (кг); v — скорость (м/с); r — радиус (м); |q| — модуль заряда (Кл); B — магнитная индукция (Тл); E<sub>к</sub> — энергия (Дж).</p><div class=\"note\">Если <span class=\"vec\">v</span> параллельна <span class=\"vec\">B</span> — движение прямолинейное; если под углом — по винтовой линии.</div></section>"},{"title":"Вещество в магнитном поле","desc":"Определение · магнитная проницаемость · 3 типа","emoji":"🧱","html":"<section class=\"qa\"><h3>Определение:</h3><p>Вещества в магнитном поле <strong>намагничиваются</strong> — приобретают собственное магнитное поле, которое изменяет результирующую магнитную индукцию.</p></section><section class=\"qa\"><h3>Магнитная проницаемость:</h3><p><strong>Относительная магнитная проницаемость μ</strong> показывает, во сколько раз магнитная индукция в веществе отличается от индукции без него <strong>при одинаковом намагничивающем поле</strong>.</p><div class=\"formula\">μ = B / B₀<small>Для линейной однородной среды; μ — безразмерная величина.</small></div></section><section class=\"qa\"><h3>Диамагнетики:</h3><p>Намагничиваются <strong>против</strong> внешнего поля, немного ослабляют его: <strong>μ &lt; 1</strong>. Примеры: <strong>медь, вода, висмут</strong>.</p></section><section class=\"qa\"><h3>Парамагнетики:</h3><p>Слабо намагничиваются <strong>по</strong> внешнему полю, немного усиливают его: <strong>μ &gt; 1</strong>. Примеры: <strong>алюминий, кислород</strong>.</p></section><section class=\"qa\"><h3>Ферромагнетики:</h3><p>Сильно намагничиваются по полю; могут сохранять намагниченность: обычно <strong>μ ≫ 1</strong>. Примеры: <strong>железо, никель, кобальт</strong>.</p><p>В них есть <strong>магнитные домены</strong>. Выше температуры Кюри ферромагнитные свойства исчезают. Для них μ не является постоянной.</p></section>"},{"title":"Вихревое электрическое поле","desc":"Определение · свойства · таблица","emoji":"🔄","html":"<section class=\"qa\"><h3>Определение:</h3><p><strong>Вихревое электрическое поле</strong> — электрическое поле, возникающее при <strong>изменении магнитного поля</strong> со временем. Оно может приводить заряды в движение даже в неподвижном проводнике.</p></section><section class=\"qa\"><h3>Свойства (таблица):</h3><div class=\"table-scroll\"><table><thead><tr><th>Что спрашивают</th><th>Ответ</th></tr></thead><tbody><tr><td>Что создаёт?</td><td>Изменяющееся магнитное поле</td></tr><tr><td>Силовые линии</td><td>Замкнутые</td></tr><tr><td>На что действует?</td><td>На электрические заряды</td></tr><tr><td>Работа по замкнутому пути</td><td>Может быть не равна нулю</td></tr><tr><td>Потенциальное?</td><td>Нет, непотенциальное поле</td></tr><tr><td>Что вызывает в контуре?</td><td>ЭДС индукции и ток, если цепь замкнута</td></tr></tbody></table></div></section><section class=\"qa\"><h3>Отличие от электростатического поля:</h3><p>Электростатическое поле создаётся <strong>неподвижными зарядами</strong>, его силовые линии начинаются на «+» и заканчиваются на «−»; работа по замкнутому пути равна нулю. Вихревое поле создаётся <strong>изменением B</strong>, и его линии замкнуты.</p></section>"},{"title":"Электромагнитная индукция","desc":"Определение явления · формулировка · опыт Фарадея","emoji":"🧲","html":"<section class=\"qa\"><h3>Определение:</h3><p><strong>Электромагнитная индукция</strong> — явление возникновения ЭДС индукции при изменении магнитного потока через контур. Если контур замкнут, возникает <strong>индукционный ток</strong>.</p></section><section class=\"qa\"><h3>Формулировка:</h3><p>Индукция возникает, когда <strong>изменяется магнитный поток</strong> через поверхность, ограниченную контуром — например, из-за движения магнита или изменения магнитного поля.</p></section><section class=\"qa\"><h3>Определение ЭДС индукции:</h3><p><strong>ЭДС индукции</strong> — величина, характеризующая действие сторонних сил, перемещающих заряды по контуру при электромагнитной индукции. Измеряется в вольтах (В).</p></section><section class=\"qa\"><h3>Опыт Фарадея:</h3><p>Катушку соединяют с <strong>гальванометром</strong> и перемещают магнит относительно катушки.</p><ul><li>Вводим магнит — стрелка отклоняется: есть ток.</li><li>Останавливаем магнит — ток исчезает.</li><li>Выводим магнит — ток меняет направление.</li><li>Двигаем быстрее — модуль ЭДС становится больше.</li></ul></section><section class=\"qa\"><h3>Вывод:</h3><p>Важен <strong>не сам магнит</strong>, а изменение магнитного потока через контур.</p></section>"},{"title":"Закон электромагнитной индукции","desc":"Формулировка · неподвижный контур · природа ЭДС","emoji":"📐","html":"<section class=\"qa\"><h3>Определение ЭДС и потока:</h3><p><strong>ЭДС индукции</strong> — работа сторонних сил по переносу единичного положительного заряда. <strong>Магнитный поток</strong> — величина, характеризующая, сколько магнитного поля проходит через выбранную поверхность.</p></section><section class=\"qa\"><h3>Формулировка:</h3><p>ЭДС электромагнитной индукции в контуре равна <strong>скорости изменения магнитного потока</strong> через него, взятой с противоположным знаком.</p></section><section class=\"qa\"><h3>Магнитный поток:</h3><div class=\"formula\">Φ = B · S · cos α</div><p>Φ — магнитный поток (Вб); S — площадь контура (м²); α — угол <strong>между <span class=\"vec\">B</span> и нормалью</strong> к поверхности.</p></section><section class=\"qa\"><h3>Формула закона:</h3><div class=\"formula\">ε<sub>и</sub> = − ΔΦ / Δt<small>Средняя ЭДС; для N одинаковых витков: εᵢ = −N·ΔΦ/Δt.</small></div><p>ЭДС измеряется в <strong>вольтах (В)</strong>. Минус объясняется правилом Ленца.</p></section><section class=\"qa\"><h3>В неподвижном контуре:</h3><p>Даже если проводник неподвижен, ЭДС возникает при <strong>изменении магнитного поля</strong> и, следовательно, потока через контур.</p></section><section class=\"qa\"><h3>Природа ЭДС индукции:</h3><p><strong>Изменяющееся магнитное поле порождает вихревое электрическое поле.</strong> Его сила действует на свободные заряды в неподвижном проводнике — поэтому возникает ЭДС, а в замкнутом контуре и ток.</p></section>"},{"title":"Правило Ленца","desc":"Правило · 4 схемы · направление тока","emoji":"↺","html":"<section class=\"qa\"><h3>Определение индукционного тока:</h3><p><strong>Индукционный ток</strong> — электрический ток, который возникает в замкнутом контуре при изменении магнитного потока через него.</p></section><section class=\"qa\"><h3>Правило (формулировка):</h3><p><strong>Индукционный ток</strong> направлен так, что создаваемое им магнитное поле <strong>противодействует изменению магнитного потока</strong>, вызвавшему этот ток.</p></section><section class=\"qa\"><h3>Как определить направление:</h3><p>Поток <strong>увеличивается</strong> → поле тока направлено против внешнего поля. Поток <strong>уменьшается</strong> → поле тока направлено по внешнему полю, поддерживая его.</p></section><section class=\"qa\"><h3>Рисунки: вид на кольцо со стороны магнита:</h3></section><section class=\"qa\"><h3>Пример 1:</h3><p><strong>N приближается</strong>: поток увеличивается, ближняя сторона кольца становится <strong>N</strong>, отталкивает магнит; ток ↺.</p></section><section class=\"qa\"><h3>Пример 2:</h3><p><strong>N удаляется</strong>: поток уменьшается, ближняя сторона кольца становится <strong>S</strong>, притягивает магнит; ток ↻.</p></section>"},{"title":"ЭДС в движущемся проводнике","desc":"Формулировка · формула · правая рука · пример","emoji":"↗️","html":"<section class=\"qa\"><h3>Определение ЭДС индукции:</h3><p><strong>ЭДС индукции в движущемся проводнике</strong> — ЭДС, возникающая из-за разделения электрических зарядов магнитной силой при движении проводника в магнитном поле.</p></section><section class=\"qa\"><h3>Формулировка:</h3><p>При движении проводника в магнитном поле свободные заряды испытывают действие магнитной силы и разделяются. Между концами проводника возникает <strong>ЭДС индукции</strong>.</p></section><section class=\"qa\"><h3>Формула:</h3><div class=\"formula\">|ε<sub>и</sub>| = B · ℓ · v<small>Когда <span class=\"vec\">B</span>, скорость <span class=\"vec\">v</span> и проводник взаимно перпендикулярны.</small></div><p>B — индукция (Тл); ℓ — длина проводника (м); v — скорость (м/с); ε<sub>и</sub> — ЭДС (В).</p></section><section class=\"qa\"><h3>Правило правой руки:</h3><p>Поверни <strong>правую ладонь</strong> так, чтобы линии <span class=\"vec\">B</span> входили в неё. <strong>Большой палец</strong> направь по движению проводника. <strong>Четыре пальца</strong> покажут направление индукционного тока в замкнутой цепи (движения положительных зарядов).</p></section><section class=\"qa\"><h3>Пример 1:</h3><p><span class=\"vec\">B</span> направлено <strong>в лист</strong> (×), стержень движется <strong>вправо</strong> → «+» на верхнем конце, «−» на нижнем.</p></section><section class=\"qa\"><h3>Пример 2:</h3><p>При том же <span class=\"vec\">B</span> стержень движется <strong>влево</strong> → полярность меняется: сверху «−», снизу «+».</p></section>"},{"title":"Самоиндукция","desc":"Определение · цепочка · схема · пример","emoji":"🔁","html":"<section class=\"qa\"><h3>Определение:</h3><p><strong>Самоиндукция</strong> — возникновение ЭДС индукции в проводящем контуре при изменении силы тока <strong>в этом же контуре</strong>.</p></section><section class=\"qa\"><h3>Цепочка возникновения:</h3><div class=\"steps\"><span class=\"step\">Изменяется ток I</span><span class=\"arrow\">→</span><span class=\"step\">Меняется своё поле B</span><span class=\"arrow\">→</span><span class=\"step\">Меняется поток Φ</span><span class=\"arrow\">→</span><span class=\"step\">Возникает ε<sub>си</sub></span><span class=\"arrow\">→</span><span class=\"step\">Противодействие изменению тока</span></div></section><section class=\"qa\"><h3>Пример: электрическая цепь:</h3></section><section class=\"qa\"><h3>Пример при включении:</h3><p>В цепи с катушкой <strong>ток нарастает постепенно</strong>, поэтому последовательно включённая лампа может загораться с задержкой.</p></section><section class=\"qa\"><h3>Пример при выключении:</h3><p>Катушка стремится <strong>поддержать исчезающий ток</strong>. При достаточной ЭДС возможна краткая вспышка неоновой лампы, включённой параллельно катушке.</p></section>"},{"title":"Закон самоиндукции","desc":"Формулировка · формула · индуктивность","emoji":"🔌","html":"<section class=\"qa\"><h3>Определение ЭДС самоиндукции:</h3><p><strong>ЭДС самоиндукции</strong> — ЭДС, возникающая в контуре при изменении тока в этом же контуре. Она противодействует изменению тока.</p></section><section class=\"qa\"><h3>Формулировка:</h3><p>ЭДС самоиндукции равна <strong>скорости изменения силы тока, умноженной на индуктивность</strong>, с противоположным знаком.</p></section><section class=\"qa\"><h3>Формула:</h3><div class=\"formula\">ε<sub>си</sub> = −L · ΔI / Δt<small>При постоянной индуктивности L; формула с Δ даёт среднюю ЭДС.</small></div><p>ε<sub>си</sub> — ЭДС (В); L — индуктивность (Гн); ΔI — изменение тока (А); Δt — время (с).</p></section><section class=\"qa\"><h3>Что означает минус:</h3><p>ЭДС самоиндукции <strong>препятствует увеличению тока</strong> при включении и <strong>поддерживает ток</strong> при выключении.</p></section><section class=\"qa\"><h3>Определение индуктивности:</h3><p><strong>Индуктивность L</strong> — физическая величина, характеризующая связь тока в цепи с магнитным потоком, создаваемым этим током, и способность цепи проявлять самоиндукцию.</p></section><section class=\"qa\"><h3>Формула индуктивности:</h3><div class=\"formula\">L = Ψ / I<small>Ψ — потокосцепление катушки (для линейной среды).</small></div></section><section class=\"qa\"><h3>Единица и зависимость:</h3><p>Единица — <strong>генри (Гн)</strong>: при L = 1 Гн изменение тока на 1 А за 1 с создаёт |ε<sub>си</sub>| = 1 В. L зависит от <strong>числа витков, размеров и формы катушки, материала сердечника</strong>.</p></section>"},{"title":"Энергия полей","desc":"Магнитное поле · электрическое поле · сохранение","emoji":"✨","html":"<section class=\"qa\"><h3>Энергия магнитного поля:</h3><p><strong>Определение:</strong> энергия магнитного поля — энергия, запасённая в магнитном поле, например вокруг катушки, по которой идёт ток.</p><p><strong>Формула для катушки:</strong></p><div class=\"formula\">W<sub>магн</sub> = L · I² / 2</div></section><section class=\"qa\"><h3>Энергия электрического поля:</h3><p><strong>Определение:</strong> энергия электрического поля — энергия, связанная с электрическим полем зарядов, например между обкладками заряженного конденсатора.</p><p><strong>Формула для конденсатора:</strong></p><div class=\"formula\">W<sub>эл</sub> = C · U² / 2 = q² / (2C)</div></section><section class=\"qa\"><h3>Закон сохранения электромагнитной энергии:</h3><p>Энергия не создаётся из ничего и не исчезает, а переходит из одной формы в другую. <strong>В идеальном колебательном контуре</strong> полная электромагнитная энергия постоянна.</p><div class=\"formula\">W = W<sub>эл</sub> + W<sub>магн</sub> = const</div></section><section class=\"qa\"><h3>Обозначения:</h3><p>W — энергия (Дж); L — индуктивность (Гн); I — ток (А); C — электроёмкость (Ф); U — напряжение (В); q — заряд (Кл).</p></section><section class=\"qa\"><h3>Пример:</h3><p>В колебательном контуре энергия электрического поля конденсатора переходит в магнитную энергию катушки и обратно. <strong>В реальной цепи</strong> часть энергии уходит в тепло и излучение, поэтому сумма W<sub>эл</sub> + W<sub>магн</sub> может уменьшаться, хотя полная энергия с учётом окружающей среды сохраняется.</p></section>"}];

"Закон самоиндукции":`<section class="qa"><div class="diagram topic-figure"><h4>Рисунок по теме</h4><svg viewBox="0 0 260 150" role="img" aria-label="Закон самоиндукции и индуктивность"><defs><marker id="arr14" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#cf6b7b"/></marker></defs><g fill="none" stroke="#6e79c2" stroke-width="3"><path d="M40 72 q8 -17 16 0 q8 -17 16 0 q8 -17 16 0 q8 -17 16 0"/></g><line x1="32" y1="72" x2="40" y2="72" stroke="#6e79c2" stroke-width="3"/><line x1="104" y1="72" x2="125" y2="72" stroke="#6e79c2" stroke-width="3"/><line x1="125" y1="72" x2="125" y2="37" stroke="#cf6b7b" stroke-width="3" marker-end="url(#arr14)"/><text x="113" y="33" font-size="12" fill="#cf6b7b" font-weight="700">εси</text><path d="M164 108 C180 60, 202 82, 220 32" fill="none" stroke="#6671b9" stroke-width="3"/><line x1="156" y1="112" x2="230" y2="112" stroke="#98a6d1" stroke-width="2"/><line x1="156" y1="112" x2="156" y2="22" stroke="#98a6d1" stroke-width="2"/><text x="178" y="127" font-size="11" fill="#6671b9">t</text><text x="144" y="29" font-size="11" fill="#6671b9">I</text><text x="27" y="112" font-size="11" fill="#6c7890">катушка</text></svg><span class="caption">Чем больше индуктивность L и быстрее меняется ток, тем больше по модулю ЭДС самоиндукции.</span></div></section>`,
"Энергия полей":`<section class="qa"><div class="diagram topic-figure"><h4>Рисунок по теме</h4><svg viewBox="0 0 260 150" role="img" aria-label="Переход энергии между конденсатором и катушкой"><defs><marker id="arr15" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6671b9"/></marker></defs><line x1="40" y1="38" x2="40" y2="98" stroke="#cf6b7b" stroke-width="4"/><line x1="58" y1="38" x2="58" y2="98" stroke="#cf6b7b" stroke-width="4"/><text x="25" y="118" font-size="12" fill="#cf6b7b" font-weight="700">Wэл</text><g fill="none" stroke="#6e79c2" stroke-width="3"><path d="M169 67 q8 -17 16 0 q8 -17 16 0 q8 -17 16 0 q8 -17 16 0"/></g><text x="182" y="118" font-size="12" fill="#6e79c2" font-weight="700">Wмагн</text><path d="M78 50 C100 32, 132 32, 155 50" fill="none" stroke="#6671b9" stroke-width="3" marker-end="url(#arr15)"/><path d="M155 86 C132 104, 100 104, 78 86" fill="none" stroke="#6671b9" stroke-width="3" marker-end="url(#arr15)"/><text x="42" y="26" font-size="11" fill="#6c7890">конденсатор</text><text x="182" y="26" font-size="11" fill="#6c7890">катушка</text></svg><span class="caption">В колебательном контуре энергия электрического поля переходит в магнитную и обратно.</span></div></section>`
};
function getFigure(title){return figures[title]||'';}
let isChanging=false;
function render(){
 const item=cards[index];
 document.getElementById('number').textContent=String(index+1).padStart(2,'0')+' / '+cards.length;
 document.getElementById('title').textContent=item.title;
 document.getElementById('subtitle').textContent=item.desc;
 document.getElementById('symbol').textContent=item.emoji;
 body.innerHTML=item.html+getFigure(item.title);
 // Один рисунок на тему, всегда после всех определений, формул и примеров.
 body.querySelectorAll('.diagram:not(.topic-figure)').forEach(oldDrawing=>oldDrawing.remove());
 body.scrollTop=0;
 [...progress.children].forEach((seg,i)=>{seg.className='segment'+(i<index?' past':i===index?' active':'')});
}
function navigate(direction){
 const next=index+direction;
 if(next<0||next>=cards.length||isChanging)return;
 isChanging=true;
 const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduce){index=next;render();isChanging=false;return}
 sheet.classList.add(direction>0?'go-left':'go-right');
 setTimeout(()=>{index=next;render();sheet.style.transition='none';sheet.classList.remove('go-left','go-right');void sheet.offsetHeight;sheet.style.transition='';isChanging=false},165);
}
// Горизонтальное перелистывание; вертикальная прокрутка текста остаётся доступной.
let touchStart=null;
app.addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;
 touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
app.addEventListener('touchend',e=>{
 if(!touchStart)return;
 const dx=e.changedTouches[0].clientX-touchStart.x;
 const dy=e.changedTouches[0].clientY-touchStart.y;
 touchStart=null;
 if(Math.abs(dx)>=54&&Math.abs(dx)>Math.abs(dy)*1.25)navigate(dx<0?1:-1);
},{passive:true});
app.addEventListener('touchcancel',()=>{touchStart=null},{passive:true});
// Поддержка перелистывания мышью при проверке сайта на компьютере.
let pointerStart=null;
app.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0)pointerStart={x:e.clientX,y:e.clientY}});
app.addEventListener('pointerup',e=>{if(!pointerStart)return;const dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y;pointerStart=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)navigate(dx<0?1:-1)});
app.addEventListener('pointercancel',()=>{pointerStart=null});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')navigate(-1);if(e.key==='ArrowRight')navigate(1)});
render();
</script>
