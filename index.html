<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ЕГЭ Тренажёр</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                "Segoe UI",
                Arial,
                sans-serif;

            color: #111827;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(80, 170, 255, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    rgba(30, 110, 230, 0.25),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #eef7ff,
                    #dceeff,
                    #f7fbff,
                    #d9ecff
                );

            background-size: 180% 180%;

            animation: backgroundMove 14s ease-in-out infinite;
        }

        @keyframes backgroundMove {

            0% {
                background-position: 0% 0%;
            }

            50% {
                background-position: 100% 100%;
            }

            100% {
                background-position: 0% 0%;
            }
        }

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 55vw;
            height: 55vw;

            max-width: 420px;
            max-height: 420px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.25);

            filter: blur(45px);

            pointer-events: none;

            animation: floatingBlob 12s ease-in-out infinite;
        }

        body::before {
            top: -15%;
            left: -10%;
        }

        body::after {
            right: -15%;
            bottom: -10%;

            animation-delay: -6s;
        }

        @keyframes floatingBlob {

            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, 20px) scale(1.15);
            }

            100% {
                transform: translate(0, 0) scale(1);
            }
        }


        /* =========================
           ОБЩИЙ ЭКРАН
        ========================= */

        .screen {
            position: relative;

            width: 100%;
            height: 100%;

            display: none;

            flex-direction: column;

            padding:
                calc(env(safe-area-inset-top) + 20px)
                18px
                calc(env(safe-area-inset-bottom) + 20px);

            overflow: hidden;
        }

        .screen.active {
            display: flex;
        }


        /* =========================
           HOME
        ========================= */

        #homeScreen {
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .home-content {
            width: min(90vw, 420px);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .home-title {
            font-size: clamp(30px, 9vw, 46px);
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .home-subtitle {
            font-size: 16px;
            line-height: 1.45;

            max-width: 330px;

            color: rgba(17, 24, 39, 0.65);
        }


        /* =========================
           GLASS BUTTON
        ========================= */

        .glass-button {
            border: 1px solid rgba(255, 255, 255, 0.8);

            background: rgba(255, 255, 255, 0.48);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 12px 35px rgba(30, 100, 200, 0.12),
                inset 0 1px 2px rgba(255, 255, 255, 0.95);

            color: #111827;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                box-shadow 0.15s ease;
        }

        .glass-button:active {
            transform: scale(0.96);

            background: rgba(255, 255, 255, 0.68);

            box-shadow:
                0 5px 18px rgba(30, 100, 200, 0.1),
                inset 0 1px 2px rgba(255, 255, 255, 1);
        }

        .start-button {
            width: min(86vw, 350px);
            min-height: 64px;

            padding: 15px 25px;

            border-radius: 22px;

            font-size: 18px;
            font-weight: 700;
        }


        /* =========================
           TOP BACK BUTTON
        ========================= */

        .back-button {
            position: absolute;

            top: calc(env(safe-area-inset-top) + 14px);
            left: 16px;

            width: 42px;
            height: 42px;

            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
            font-weight: 400;

            z-index: 20;
        }


        /* =========================
           TOPICS
        ========================= */

        #topicsScreen {
            align-items: center;
        }

        .topics-title {
            margin-top: 60px;
            margin-bottom: 25px;

            font-size: 28px;
            font-weight: 800;
        }

        .topics-list {
            width: min(92vw, 430px);

            display: flex;
            flex-direction: column;

            gap: 12px;
        }

        .topic-button {
            position: relative;

            width: 100%;
            min-height: 65px;

            padding: 12px 17px;

            border-radius: 19px;

            display: flex;
            align-items: center;

            text-align: left;

            font-size: 16px;
            font-weight: 650;
        }

        .topic-button.disabled {
            opacity: 0.42;
            cursor: default;
        }

        .topic-button .soon {
            margin-left: auto;

            font-size: 11px;
            font-weight: 700;

            padding: 5px 8px;

            border-radius: 8px;

            background: rgba(100, 116, 139, 0.12);
            color: #64748b;
        }


        /* =========================
           TRAINING
        ========================= */

        #trainingScreen {
            padding-left: 0;
            padding-right: 0;
            padding-bottom: 0;
        }


        /* =========================
           STATS
        ========================= */

        .stats {
            position: absolute;

            top: calc(env(safe-area-inset-top) + 14px);
            left: 50%;

            transform: translateX(-50%);

            width: min(78vw, 320px);

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            gap: 5px;

            z-index: 10;
        }

        .stat {
            height: 34px;

            padding: 0 6px;

            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            font-size: 10px;
            font-weight: 650;

            white-space: nowrap;

            border: 1px solid rgba(255, 255, 255, 0.7);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 7px 18px rgba(30, 100, 200, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.85);
        }

        .stat.correct {
            color: #16803c;
            background: rgba(220, 252, 231, 0.58);
        }

        .stat.wrong {
            color: #dc2626;
            background: rgba(254, 226, 226, 0.58);
        }

        .stat.total {
            color: #64748b;
            background: rgba(241, 245, 249, 0.58);
        }


        /* =========================
           TRAINING TOP
        ========================= */

        .training-top {
            position: relative;

            height: 50%;

            min-height: 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding:
                75px
                20px
                15px;
        }

        .word-area {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            min-height: 130px;

            text-align: center;
        }

        .word {
            font-size: clamp(38px, 11vw, 58px);

            font-weight: 800;

            letter-spacing: -1px;

            color: #111827;

            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word .missing {
            display: inline-block;

            min-width: 0.6em;

            color: #2563eb;
        }


        /* =========================
           RESULT
        ========================= */

        .result {
            margin-top: 12px;

            display: flex;
            flex-direction: column;

            align-items: center;

            min-height: 54px;

            text-align: center;
        }

        .result-label {
            font-size: 12px;
            font-weight: 600;

            color: rgba(17, 24, 39, 0.55);

            line-height: 1.3;
        }

        .result-word {
            margin-top: 3px;

            font-size: 16px;
            font-weight: 700;

            line-height: 1.3;
        }

        .result.correct-result .result-word {
            color: #16803c;
        }

        .result.wrong-result .result-word {
            color: #dc2626;
        }


        /* =========================
           ANSWER AREA
        ========================= */

        .training-bottom {
            height: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                10px
                20px
                calc(env(safe-area-inset-bottom) + 25px);
        }

        .answer-buttons {
            width: min(78vw, 310px);

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 16px;
        }

        .answer-button {
            width: 100%;
            aspect-ratio: 1 / 1;

            border-radius: 25px;

            font-size: clamp(36px, 11vw, 58px);
            font-weight: 750;

            display: flex;
            align-items: center;
            justify-content: center;

            user-select: none;

            transition:
                transform 0.12s ease,
                background 0.15s ease,
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .answer-button:active {
            transform: scale(0.94);
        }

        .answer-button.correct-answer {
            background: rgba(187, 247, 208, 0.75);
            border-color: rgba(34, 197, 94, 0.7);

            color: #15803d;

            box-shadow:
                0 12px 30px rgba(34, 197, 94, 0.15),
                inset 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        .answer-button.wrong-answer {
            background: rgba(254, 202, 202, 0.78);
            border-color: rgba(239, 68, 68, 0.7);

            color: #dc2626;

            box-shadow:
                0 12px 30px rgba(239, 68, 68, 0.15),
                inset 0 1px 2px rgba(255, 255, 255, 0.95);
        }

        .answer-button.disabled {
            pointer-events: none;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        .fade-in {
            animation: fadeIn 0.22s ease;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pop {
            animation: pop 0.18s ease;
        }

        @keyframes pop {

            0% {
                transform: scale(0.92);
            }

            70% {
                transform: scale(1.04);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-height: 650px) {

            .training-top {
                padding-top: 65px;
            }

            .word {
                font-size: 38px;
            }

            .answer-buttons {
                width: min(65vw, 240px);
                gap: 12px;
            }

            .answer-button {
                border-radius: 20px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         HOME
    ========================= -->

    <section
        id="homeScreen"
        class="screen active"
    >

        <div class="home-content">

            <div class="home-title">
                ЕГЭ Русский
            </div>

            <div class="home-subtitle">
                Тренажёр для подготовки к экзамену
            </div>

            <button
                class="glass-button start-button"
                id="startTrainingButton"
            >
                📚 Начать тренировку
            </button>

        </div>

    </section>



    <!-- =========================
         TOPICS
    ========================= -->

    <section
        id="topicsScreen"
        class="screen"
    >

        <button
            class="glass-button back-button"
            id="topicsBackButton"
            aria-label="Назад"
        >
            &lt;
        </button>


        <div class="topics-title">
            Темы
        </div>


        <div class="topics-list">

            <button
                class="glass-button topic-button"
                id="prePriTopic"
            >
                📚 Приставка ПРЕ- и ПРИ-
            </button>


            <button
                class="glass-button topic-button disabled"
                disabled
            >
                📝 Ударения

                <span class="soon">
                    Скоро
                </span>
            </button>


            <button
                class="glass-button topic-button disabled"
                disabled
            >
                🔤 Правописание НЕ

                <span class="soon">
                    Скоро
                </span>
            </button>


            <button
                class="glass-button topic-button disabled"
                disabled
            >
                📖 Лексические нормы

                <span class="soon">
                    Скоро
                </span>
            </button>


            <button
                class="glass-button topic-button disabled"
                disabled
            >
                ✏️ Грамматические нормы

                <span class="soon">
                    Скоро
                </span>
            </button>

        </div>

    </section>



    <!-- =========================
         TRAINING
    ========================= -->

    <section
        id="trainingScreen"
        class="screen"
    >


        <button
            class="glass-button back-button"
            id="trainingBackButton"
            aria-label="Назад"
        >
            &lt;
        </button>


        <!-- СЧЁТЧИК -->

        <div class="stats">

            <div
                class="stat correct"
                id="correctStat"
            >
                Верно: 0
            </div>

            <div
                class="stat wrong"
                id="wrongStat"
            >
                Неверно: 0
            </div>

            <div
                class="stat total"
                id="totalStat"
            >
                Всего: 0
            </div>

        </div>


        <!-- ВЕРХ -->

        <div class="training-top">

            <div
                class="word-area"
                id="wordArea"
            >

                <div
                    class="word"
                    id="word"
                >
                    пр_красный
                </div>


                <div
                    class="result"
                    id="result"
                >

                    <div
                        class="result-label"
                        id="resultLabel"
                    ></div>

                    <div
                        class="result-word"
                        id="resultWord"
                    ></div>

                </div>

            </div>

        </div>


        <!-- НИЗ -->

        <div class="training-bottom">

            <div class="answer-buttons">

                <button
                    class="glass-button answer-button"
                    data-letter="е"
                    id="buttonE"
                >
                    Е
                </button>

                <button
                    class="glass-button answer-button"
                    data-letter="и"
                    id="buttonI"
                >
                    И
                </button>

            </div>

        </div>

    </section>



<script>

    /* =========================================================
       TELEGRAM
    ========================================================= */

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    /*
       Проверяем, действительно ли приложение
       открыто внутри Telegram.
    */

    console.log("=== TELEGRAM WEB APP ===");

    console.log(
        "Platform:",
        tg.platform
    );

    console.log(
        "Version:",
        tg.version
    );

    console.log(
        "initData:",
        tg.initData
    );

    console.log(
        "initData length:",
        tg.initData
            ? tg.initData.length
            : 0
    );

    console.log(
        "initDataUnsafe:",
        tg.initDataUnsafe
    );


    if (!tg.initData) {

        console.warn(
            "Telegram initData пустой. " +
            "Приложение необходимо открыть " +
            "через кнопку Telegram Mini App."
        );

    }


    /* =========================================================
       BACKEND
    ========================================================= */

    const API_URL =
        "https://ege-duo-backend.onrender.com/wrong-answer";


    /* =========================================================
       СЛОВА
    ========================================================= */

    const words = [

        {
            before: "пр",
            after: "красный",
            correct: "е",
            full: "прекрасный"
        },

        {
            before: "пр",
            after: "клеить",
            correct: "и",
            full: "приклеить"
        },

        {
            before: "пр",
            after: "одолеть",
            correct: "е",
            full: "преодолеть"
        },

        {
            before: "пр",
            after: "бежать",
            correct: "и",
            full: "прибежать"
        },

        {
            before: "пр",
            after: "высить",
            correct: "е",
            full: "превысить"
        },

        {
            before: "пр",
            after: "украсить",
            correct: "и",
            full: "приукрасить"
        },

        {
            before: "пр",
            after: "взойти",
            correct: "е",
            full: "превзойти"
        }

    ];


    /* =========================================================
       СОСТОЯНИЕ ТРЕНИРОВКИ
    ========================================================= */

    let correctCount = 0;

    let wrongCount = 0;

    let activeWords = [];

    let delayedWords = [];

    let currentWord = null;

    let answerLocked = false;

    let currentRoundNumber = 0;


    /* =========================================================
       DOM
    ========================================================= */

    const homeScreen =
        document.getElementById("homeScreen");

    const topicsScreen =
        document.getElementById("topicsScreen");

    const trainingScreen =
        document.getElementById("trainingScreen");


    const startTrainingButton =
        document.getElementById("startTrainingButton");

    const prePriTopic =
        document.getElementById("prePriTopic");


    const topicsBackButton =
        document.getElementById("topicsBackButton");

    const trainingBackButton =
        document.getElementById("trainingBackButton");


    const wordElement =
        document.getElementById("word");

    const resultElement =
        document.getElementById("result");

    const resultLabel =
        document.getElementById("resultLabel");

    const resultWord =
        document.getElementById("resultWord");


    const correctStat =
        document.getElementById("correctStat");

    const wrongStat =
        document.getElementById("wrongStat");

    const totalStat =
        document.getElementById("totalStat");


    const buttonE =
        document.getElementById("buttonE");

    const buttonI =
        document.getElementById("buttonI");


    const answerButtons = [
        buttonE,
        buttonI
    ];


    /* =========================================================
       ЭКРАНЫ
    ========================================================= */

    function showScreen(screen) {

        document
            .querySelectorAll(".screen")
            .forEach(item => {

                item.classList.remove("active");

            });

        screen.classList.add("active");
    }


    /* =========================================================
       HOME → TOPICS
    ========================================================= */

    startTrainingButton.addEventListener(
        "click",
        () => {

            showScreen(topicsScreen);

        }
    );


    /* =========================================================
       TOPICS → HOME
    ========================================================= */

    topicsBackButton.addEventListener(
        "click",
        () => {

            showScreen(homeScreen);

        }
    );


    /* =========================================================
       TRAINING → TOPICS
    ========================================================= */

    trainingBackButton.addEventListener(
        "click",
        () => {

            answerLocked = true;

            showScreen(topicsScreen);

        }
    );


    /* =========================================================
       НАЧАТЬ ПРЕ-/ПРИ-
    ========================================================= */

    prePriTopic.addEventListener(
        "click",
        () => {

            startTraining();

        }
    );


    /* =========================================================
       НАЧАЛО ТРЕНИРОВКИ
    ========================================================= */

    function startTraining() {

        correctCount = 0;

        wrongCount = 0;

        currentRoundNumber = 0;

        answerLocked = false;


        activeWords = [...words];

        delayedWords = [];


        shuffle(activeWords);


        updateStats();

        showScreen(trainingScreen);

        nextWord();

    }


    /* =========================================================
       RANDOM SHUFFLE
    ========================================================= */

    function shuffle(array) {

        for (
            let i = array.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(Math.random() * (i + 1));

            [
                array[i],
                array[j]
            ] =
            [
                array[j],
                array[i]
            ];

        }

        return array;
    }


    /* =========================================================
       СЛУЧАЙНОЕ ЧИСЛО 10–20
    ========================================================= */

    function randomDelay() {

        return Math.floor(
            Math.random() * 11
        ) + 10;

    }


    /* =========================================================
       СЛЕДУЮЩЕЕ СЛОВО
    ========================================================= */

    function nextWord() {

        answerLocked = false;

        resetButtons();

        clearResult();


        if (
            activeWords.length === 0 &&
            delayedWords.length === 0
        ) {

            finishTraining();

            return;

        }


        currentRoundNumber++;


        for (
            const item of delayedWords
        ) {

            item.delay--;

        }


        const readyWords =
            delayedWords.filter(
                item => item.delay <= 0
            );


        delayedWords =
            delayedWords.filter(
                item => item.delay > 0
            );


        let selectedWord = null;


        if (readyWords.length > 0) {

            const randomIndex =
                Math.floor(
                    Math.random() *
                    readyWords.length
                );

            selectedWord =
                readyWords[randomIndex].word;


            for (
                let i = 0;
                i < readyWords.length;
                i++
            ) {

                if (
                    i !== randomIndex
                ) {

                    delayedWords.push({
                        word: readyWords[i].word,
                        delay: 0
                    });

                }

            }

        }


        if (!selectedWord) {

            if (activeWords.length > 0) {

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        activeWords.length
                    );

                selectedWord =
                    activeWords[randomIndex];

            }

        }


        if (!selectedWord) {

            finishTraining();

            return;

        }


        currentWord = selectedWord;

        renderWord(currentWord);

    }


    /* =========================================================
       ОТОБРАЖЕНИЕ СЛОВА
    ========================================================= */

    function renderWord(word) {

        wordElement.classList.remove("fade-in");

        void wordElement.offsetWidth;

        wordElement.classList.add("fade-in");


        wordElement.innerHTML =
            `${escapeHtml(word.before)}<span class="missing">_</span>${escapeHtml(word.after)}`;
    }


    /* =========================================================
       ОТВЕТ
    ========================================================= */

    answerButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    if (answerLocked) {
                        return;
                    }

                    if (!currentWord) {
                        return;
                    }

                    const selectedLetter =
                        button.dataset.letter;

                    checkAnswer(
                        selectedLetter
                    );

                }
            );

        }
    );


    /* =========================================================
       ПРОВЕРКА
    ========================================================= */

    function checkAnswer(letter) {

        answerLocked = true;


        wordElement.innerHTML =
            `${escapeHtml(currentWord.before)}<span class="missing">${letter}</span>${escapeHtml(currentWord.after)}`;


        const isCorrect =
            letter === currentWord.correct;


        const correctButton =
            answerButtons.find(
                button =>
                    button.dataset.letter ===
                    currentWord.correct
            );


        const selectedButton =
            answerButtons.find(
                button =>
                    button.dataset.letter ===
                    letter
            );


        if (isCorrect) {

            correctCount++;

            updateStats();


            selectedButton
                ?.classList.add(
                    "correct-answer"
                );


            removeFromActiveWords(
                currentWord
            );

            removeFromDelayedWords(
                currentWord
            );


            resultElement.className =
                "result correct-result";

            resultLabel.textContent =
                "✓ Правильно";

            resultWord.textContent =
                currentWord.full;


            setTimeout(
                () => {

                    nextWord();

                },
                1000
            );

        } else {

            wrongCount++;

            updateStats();


            selectedButton
                ?.classList.add(
                    "wrong-answer"
                );


            correctButton
                ?.classList.add(
                    "correct-answer"
                );


            resultElement.className =
                "result wrong-result";


            resultLabel.textContent =
                "правильное слово:";


            resultWord.textContent =
                currentWord.full;


            removeFromActiveWords(
                currentWord
            );

            removeFromDelayedWords(
                currentWord
            );


            delayedWords.push({

                word: currentWord,

                delay: randomDelay()

            });


            /*
               Отправляем ошибку на Render.
            */

            sendWrongAnswer(
                currentWord.full
            );


            setTimeout(
                () => {

                    nextWord();

                },
                1000
            );

        }

    }


    /* =========================================================
       ОТПРАВКА ОШИБКИ BACKEND
    ========================================================= */

    async function sendWrongAnswer(word) {

        /*
           Берём initData непосредственно
           из Telegram WebApp.
        */

        const initData =
            tg.initData;


        console.log(
            "=== ОТПРАВКА ОШИБКИ ==="
        );

        console.log(
            "Слово:",
            word
        );

        console.log(
            "initData length:",
            initData
                ? initData.length
                : 0
        );


        /*
           Если initData отсутствует,
           пользователь открыл страницу
           не как Telegram Mini App.

           Не отправляем пустой запрос.
        */

        if (!initData) {

            console.warn(
                "initData пустой."
            );

            console.warn(
                "Открой приложение через " +
                "кнопку «🚀 Открыть приложение» " +
                "в Telegram."
            );

            return;

        }


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            word: word,

                            initData: initData

                        })

                    }
                );


            console.log(
                "Backend status:",
                response.status
            );


            if (!response.ok) {

                const errorText =
                    await response.text();

                console.error(
                    "Backend error:",
                    response.status,
                    errorText
                );

                return;

            }


            const data =
                await response.json();


            console.log(
                "Ошибка отправлена:",
                data
            );


        } catch (error) {

            console.error(
                "Не удалось отправить ошибку:",
                error
            );

        }

    }


    /* =========================================================
       УДАЛИТЬ ИЗ ACTIVE
    ========================================================= */

    function removeFromActiveWords(word) {

        activeWords =
            activeWords.filter(
                item =>
                    item !== word
            );

    }


    /* =========================================================
       УДАЛИТЬ ИЗ DELAYED
    ========================================================= */

    function removeFromDelayedWords(word) {

        delayedWords =
            delayedWords.filter(
                item =>
                    item.word !== word
            );

    }


    /* =========================================================
       СТАТИСТИКА
    ========================================================= */

    function updateStats() {

        correctStat.textContent =
            `Верно: ${correctCount}`;


        wrongStat.textContent =
            `Неверно: ${wrongCount}`;


        const remaining =
            activeWords.length +
            delayedWords.length;


        totalStat.textContent =
            `Всего: ${remaining}`;

    }


    /* =========================================================
       ВАЖНО:
       После изменения delayedWords
       статистику нужно обновить.
    ========================================================= */

    function updateRemainingStat() {

        const remaining =
            activeWords.length +
            delayedWords.length;

        totalStat.textContent =
            `Всего: ${remaining}`;

    }


    /* =========================================================
       РЕЗУЛЬТАТ
    ========================================================= */

    function clearResult() {

        resultElement.className =
            "result";

        resultLabel.textContent =
            "";

        resultWord.textContent =
            "";

    }


    /* =========================================================
       КНОПКИ
    ========================================================= */

    function resetButtons() {

        answerButtons.forEach(
            button => {

                button.classList.remove(
                    "correct-answer",
                    "wrong-answer",
                    "disabled"
                );

            }
        );

    }


    /* =========================================================
       ЗАВЕРШЕНИЕ
    ========================================================= */

    function finishTraining() {

        answerLocked = true;

        resetButtons();


        wordElement.textContent =
            "🎉";


        resultElement.className =
            "result correct-result";


        resultLabel.textContent =
            "Тренировка завершена";


        resultWord.textContent =
            `Верно: ${correctCount} • Неверно: ${wrongCount}`;


        updateStats();

    }


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================================
       TELEGRAM THEME
    ========================================================= */

    if (
        tg.themeParams &&
        tg.themeParams.bg_color
    ) {

        /*
           Дизайн приложения специально
           не изменяем.
        */

    }


</script>
