<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ЕГЭ Русский язык</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            color: #111;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .logo {
            font-size: 55px;
            text-align: center;
            margin-top: 30px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .start {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: #2481cc;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .stat {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .number {
            font-size: 24px;
            font-weight: bold;
        }

        .label {
            color: #777;
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="logo">🇷🇺</div>

    <h1>ЕГЭ Русский язык</h1>

    <div class="description">
        Тренажёр для подготовки к ЕГЭ.<br>
        Решай задания и отслеживай свой прогресс.
    </div>

    <button class="start" id="startButton">
        📚 Начать тренировку
    </button>

    <div class="stats">

        <div class="stat">
            <div class="number">0</div>
            <div class="label">Решено</div>
        </div>

        <div class="stat">
            <div class="number">0%</div>
            <div class="label">Точность</div>
        </div>

    </div>

</div>

<script>
    const button = document.getElementById("startButton");

    button.addEventListener("click", function() {
        button.textContent = "📚 Загружаем тренировку...";
    });
</script>

</body>
</html>
