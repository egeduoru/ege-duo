<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ЕГЭ Тренажёр</title>


    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Segoe UI",
                sans-serif;

            color: #111827;
        }


        /* =====================================
           ФОН
        ===================================== */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            z-index: -1;

            background:
                linear-gradient(
                    120deg,
                    #eef6ff,
                    #ffffff,
                    #e7f1ff,
                    #f7fbff,
                    #eaf4ff
                );

            background-size: 500% 500%;

            animation:
                backgroundFlow 14s ease-in-out infinite;
        }


        .glow {

            position: absolute;

            width: 75vw;
            height: 75vw;

            max-width: 750px;
            max-height: 750px;

            border-radius: 50%;

            filter: blur(75px);

            opacity: 0.65;

            will-change: transform;

            animation:
                glowMove 11s ease-in-out infinite alternate;
        }


        .glow-1 {

            left: -25%;
            top: -20%;

            background:
                radial-gradient(
                    circle,
                    rgba(45,130,255,0.75) 0%,
                    rgba(70,150,255,0.45) 35%,
                    rgba(120,180,255,0.15) 55%,
                    transparent 72%
                );

            animation-duration: 11s;
        }


        .glow-2 {

            right: -25%;
            top: 10%;

            background:
                radial-gradient(
                    circle,
                    rgba(90,170,255,0.65) 0%,
                    rgba(130,195,255,0.35) 35%,
                    rgba(180,220,255,0.15) 55%,
                    transparent 72%
                );

            animation-duration: 14s;

            animation-delay: -4s;
        }


        .glow-3 {

            left: 15%;
            bottom: -35%;

            background:
                radial-gradient(
                    circle,
                    rgba(30,150,255,0.55) 0%,
                    rgba(100,190,255,0.3) 40%,
                    transparent 72%
                );

            animation-duration: 16s;

            animation-delay: -7s;
        }


        @keyframes backgroundFlow {

            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 50% 0%;
            }

            50% {
                background-position: 100% 50%;
            }

            75% {
                background-position: 50% 100%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        @keyframes glowMove {

            0% {

                transform:
                    translate(-100px,-50px)
                    scale(0.85)
                    rotate(0deg);
            }

            25% {

                transform:
                    translate(100px,70px)
                    scale(1.05)
                    rotate(20deg);
            }

            50% {

                transform:
                    translate(180px,-40px)
                    scale(1.2)
                    rotate(50deg);
            }

            75% {

                transform:
                    translate(40px,150px)
                    scale(0.95)
                    rotate(90deg);
            }

            100% {

                transform:
                    translate(-100px,50px)
                    scale(1.1)
                    rotate(130deg);
            }

        }


        /* =====================================
           ЭКРАНЫ
        ===================================== */

        .screen {

            display: none;

            width: 100%;
            height: 100%;

            padding:
                env(safe-area-inset-top)
                20px
                env(safe-area-inset-bottom)
                20px;

            position: relative;
        }


        .screen.active {
            display: flex;
        }


        /* =====================================
           ГЛАВНЫЙ ЭКРАН
        ===================================== */

        #home {

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;
        }


        h1 {

            margin: 0;

            font-size:
                clamp(
                    30px,
                    8vw,
                    42px
                );

            font-weight: 750;

            letter-spacing: -1.5px;
        }


        .subtitle {

            margin-top: 10px;

            font-size: 17px;

            color:
                rgba(17,24,39,0.55);
        }


        /* =====================================
           ГЛАВНАЯ КНОПКА
        ===================================== */

        .main-button {

            margin-top: 35px;

            min-width: 260px;

            height: 64px;

            padding: 0 30px;

            border:
                1px solid
                rgba(255,255,255,0.8);

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.8),
                    rgba(210,230,255,0.5)
                );

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:

                0 18px 45px
                rgba(30,100,200,0.13),

                inset 0 1px 2px
                rgba(255,255,255,1);

            color: #0b57c7;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease;
        }


        .main-button:active {

            transform:
                scale(0.95);
        }


        /* =====================================
           КНОПКА НАЗАД
        ===================================== */

        .back-button {

            position: absolute;

            top:
                calc(
                    env(safe-area-inset-top) + 16px
                );

            left: 20px;

            width: 48px;
            height: 48px;

            border-radius: 16px;

            border:
                1px solid
                rgba(255,255,255,0.85);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.78),
                    rgba(215,235,255,0.42)
                );

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:

                0 12px 30px
                rgba(30,100,200,0.12),

                inset 0 1px 2px
                rgba(255,255,255,1);

            display: flex;

            align-items: center;

            justify-content: center;

            color: #1769d5;

            font-size: 25px;

            font-weight: 500;

            cursor: pointer;

            z-index: 20;

            transition:
                transform 0.12s ease;
        }


        .back-button:active {

            transform:
                scale(0.88);
        }


        /* =====================================
           ТЕМЫ
        ===================================== */

        #topics {

            flex-direction: column;

            align-items: center;

            padding-top: 80px;
        }


        .top-title {

            width: 100%;

            max-width: 600px;

            text-align: left;

            margin-bottom: 30px;
        }


        .top-title h2 {

            margin: 0;

            font-size: 30px;

            letter-spacing: -1px;
        }


        .topic-list {

            width: 100%;

            max-width: 600px;

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .topic {

            width: 100%;

            min-height: 74px;

            padding: 16px 20px;

            border-radius: 24px;

            border:
                1px solid
                rgba(255,255,255,0.75);

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.72),
                    rgba(230,240,255,0.42)
                );

            backdrop-filter:
                blur(25px);

            -webkit-backdrop-filter:
                blur(25px);

            box-shadow:

                0 15px 35px
                rgba(30,100,200,0.08),

                inset 0 1px 2px
                rgba(255,255,255,0.95);

            display: flex;

            align-items: center;

            cursor: pointer;

            transition:
                transform 0.15s ease;
        }


        .topic:active {

            transform:
                scale(0.97);
        }


        .topic-icon {

            width: 45px;
            height: 45px;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 15px;

            background:
                rgba(255,255,255,0.65);

            font-size: 23px;
        }


        .topic-info {
            flex: 1;
        }


        .topic-title {

            font-size: 16px;

            font-weight: 700;
        }


        .topic-subtitle {

            margin-top: 4px;

            font-size: 13px;

            color:
                rgba(17,24,39,0.5);
        }


        .topic-arrow {

            font-size: 24px;

            color:
                rgba(20,90,190,0.5);
        }


        .topic.disabled {

            opacity: 0.42;

            cursor: default;
        }


        .topic.disabled:active {
            transform: none;
        }


        /* =====================================
           ТРЕНИРОВКА
        ===================================== */

        #training {

            flex-direction: column;

            padding:
                env(safe-area-inset-top)
                20px
                env(safe-area-inset-bottom)
                20px;
        }


        .training-top {

            height: 50%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding-top: 35px;
        }


        .training-bottom {

            height: 50%;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }


        /* =====================================
           СЧЁТЧИК
        ===================================== */

        .stats {

            position: absolute;

            top:
                calc(
                    env(safe-area-inset-top) + 14px
                );

            left: 50%;

            transform:
                translateX(-50%);

            width:
                min(
                    78vw,
                    320px
                );

            display: grid;

            grid-template-columns:
                1fr
                1fr
                1fr;

            gap: 5px;

            z-index: 10;
        }


        .stat {

            height: 34px;

            padding: 0 6px;

            border-radius: 10px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            font-size: 10px;

            font-weight: 650;

            white-space: nowrap;

            border:
                1px solid
                rgba(255,255,255,0.7);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:

                0 7px 18px
                rgba(30,100,200,0.08),

                inset 0 1px 2px
                rgba(255,255,255,0.85);
        }


        /* ЗЕЛЁНЫЙ */

        .correct-stat {

            background:
                linear-gradient(
                    135deg,
                    rgba(205,255,220,0.82),
                    rgba(160,240,190,0.55)
                );

            color: #128541;
        }


        /* КРАСНЫЙ */

        .wrong-stat {

            background:
                linear-gradient(
                    135deg,
                    rgba(255,220,220,0.85),
                    rgba(255,185,185,0.55)
                );

            color: #c82f2f;
        }


        /* СЕРЫЙ */

        .total-stat {

            background:
                linear-gradient(
                    135deg,
                    rgba(235,237,240,0.82),
                    rgba(205,210,218,0.55)
                );

            color: #4b5563;
        }


        /* =====================================
           СЛОВО
        ===================================== */

        .word-card {

            font-size:
                clamp(
                    42px,
                    11vw,
                    68px
                );

            font-weight: 750;

            letter-spacing: -2px;

            min-height: 85px;

            display: flex;

            align-items: center;

            justify-content: center;

            white-space: nowrap;

            transition:
                color 0.2s ease,
                transform 0.2s ease;
        }


        .word-card.correct {

            color: #159447;

            transform:
                scale(1.03);
        }


        .word-card.wrong {

            color: #dc3434;

            transform:
                scale(1.03);
        }


        /* =====================================
           РЕЗУЛЬТАТ
        ===================================== */

        #result {

            margin-top: 10px;

            min-height: 52px;

            font-size: 14px;

            line-height: 1.45;

            color:
                rgba(17,24,39,0.55);

            text-align: center;
        }


        .correct-word {

            margin-top: 2px;

            font-size: 20px;

            font-weight: 700;

            color: #111827;
        }


        /* =====================================
           КНОПКИ Е / И
        ===================================== */

        .answer-buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;

            width: 100%;
        }


        .answer-button {

            position: relative;

            width:
                min(
                    38vw,
                    165px
                );

            aspect-ratio: 1 / 1;

            border-radius: 32px;

            border:
                1px solid
                rgba(255,255,255,0.9);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.78),
                    rgba(215,235,255,0.42)
                );

            backdrop-filter:
                blur(30px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(30px)
                saturate(150%);

            box-shadow:

                0 20px 50px
                rgba(30,100,200,0.13),

                inset 0 1px 2px
                rgba(255,255,255,1),

                inset 0 -1px 2px
                rgba(120,170,230,0.12);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size:
                clamp(
                    48px,
                    13vw,
                    68px
                );

            font-weight: 750;

            color: #111827;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform 0.12s ease,
                background 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
        }


        .answer-button::after {

            content: "";

            position: absolute;

            top: 7px;

            left: 12px;
            right: 12px;

            height: 35%;

            border-radius: 25px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.38),
                    transparent
                );

            pointer-events: none;
        }


        .answer-button:active {

            transform:
                scale(0.91);
        }


        /* =====================================
           ПРАВИЛЬНЫЙ ОТВЕТ
        ===================================== */

        .answer-button.correct {

            border-color:
                rgba(35,190,100,0.8);

            background:
                linear-gradient(
                    145deg,
                    rgba(220,255,235,0.9),
                    rgba(180,245,205,0.55)
                );

            color: #148844;

            box-shadow:

                0 15px 40px
                rgba(30,180,90,0.2),

                inset 0 1px 2px
                rgba(255,255,255,1);
        }


        /* =====================================
           НЕПРАВИЛЬНЫЙ ОТВЕТ
        ===================================== */

        .answer-button.wrong {

            border-color:
                rgba(230,50,50,0.8);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,225,225,0.92),
                    rgba(255,195,195,0.58)
                );

            color: #d52f2f;

            box-shadow:

                0 15px 40px
                rgba(220,40,40,0.18),

                inset 0 1px 2px
                rgba(255,255,255,1);
        }


        /* =====================================
           МАЛЕНЬКИЙ ЭКРАН
        ===================================== */

        @media (max-height: 650px) {

            .answer-button {

                width:
                    min(
                        34vw,
                        135px
                    );

                border-radius: 26px;
            }


            .word-card {

                font-size: 42px;
            }


            .stat {

                height: 31px;

                font-size: 9px;
            }

        }


        /* =====================================
           ПК
        ===================================== */

        @media (min-width: 700px) {

            .answer-button {
                width: 165px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================
         ФОН
    ===================================== -->

    <div class="background">

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

        <div class="glow glow-3"></div>

    </div>



    <!-- =====================================
         ГЛАВНЫЙ ЭКРАН
    ===================================== -->

    <section
        id="home"
        class="screen active"
    >

        <h1>
            ЕГЭ Тренажёр
        </h1>


        <div class="subtitle">
            Русский язык
        </div>


        <button
            class="main-button"
            onclick="showTopics()"
        >
            📚 Начать тренировку
        </button>

    </section>



    <!-- =====================================
         ТЕМЫ
    ===================================== -->

    <section
        id="topics"
        class="screen"
    >


        <button
            class="back-button"
            onclick="showScreen('home')"
        >
            &lt;
        </button>


        <div class="top-title">

            <h2>
                Темы
            </h2>

        </div>


        <div class="topic-list">


            <!-- АКТИВНАЯ -->

            <div
                class="topic"
                onclick="startTraining()"
            >

                <div class="topic-icon">
                    📚
                </div>


                <div class="topic-info">

                    <div class="topic-title">
                        Приставка ПРЕ- и ПРИ-
                    </div>


                    <div class="topic-subtitle">
                        Тренировка
                    </div>

                </div>


                <div class="topic-arrow">
                    ›
                </div>

            </div>



            <!-- СКОРО -->

            <div class="topic disabled">

                <div class="topic-icon">
                    🔒
                </div>


                <div class="topic-info">

                    <div class="topic-title">
                        НЕ и НИ
                    </div>


                    <div class="topic-subtitle">
                        Скоро
                    </div>

                </div>

            </div>



            <div class="topic disabled">

                <div class="topic-icon">
                    🔒
                </div>


                <div class="topic-info">

                    <div class="topic-title">
                        Одна и две Н
                    </div>


                    <div class="topic-subtitle">
                        Скоро
                    </div>

                </div>

            </div>



            <div class="topic disabled">

                <div class="topic-icon">
                    🔒
                </div>


                <div class="topic-info">

                    <div class="topic-title">
                        Чередующиеся гласные
                    </div>


                    <div class="topic-subtitle">
                        Скоро
                    </div>

                </div>

            </div>


        </div>

    </section>



    <!-- =====================================
         ТРЕНИРОВКА
    ===================================== -->

    <section
        id="training"
        class="screen"
    >


        <!-- НАЗАД -->

        <button
            class="back-button"
            onclick="showScreen('topics')"
        >
            &lt;
        </button>



        <!-- =================================
             СЧЁТЧИК
        ================================= -->

        <div class="stats">


            <div class="stat correct-stat">

                Верно:
                <span id="correctCount">
                    0
                </span>

            </div>


            <div class="stat wrong-stat">

                Неверно:
                <span id="wrongCount">
                    0
                </span>

            </div>


            <div class="stat total-stat">

                Всего:
                <span id="remainingCount">
                    6
                </span>

            </div>


        </div>



        <!-- =================================
             ВЕРХ
        ================================= -->

        <div class="training-top">


            <div
                id="wordCard"
                class="word-card"
            >
                пр_красный
            </div>


            <div id="result"></div>


        </div>



        <!-- =================================
             НИЗ
        ================================= -->

        <div class="training-bottom">


            <div class="answer-buttons">


                <button
                    id="buttonE"
                    class="answer-button"
                    onclick="answer('е')"
                >
                    Е
                </button>


                <button
                    id="buttonI"
                    class="answer-button"
                    onclick="answer('и')"
                >
                    И
                </button>


            </div>


        </div>


    </section>



    <script>


        /* =====================================
           СЛОВА
        ===================================== */

        const words = [

            {
                before: "пр",
                after: "красный",
                correct: "е",
                full: "прекрасный"
            },


            {
                before: "пр",
                after: "клеить",
                correct: "и",
                full: "приклеить"
            },


            {
                before: "пр",
                after: "одолеть",
                correct: "е",
                full: "преодолеть"
            },


            {
                before: "пр",
                after: "бежать",
                correct: "и",
                full: "прибежать"
            },


            {
                before: "пр",
                after: "высить",
                correct: "е",
                full: "превысить"
            },


            {
                before: "пр",
                after: "украсить",
                correct: "и",
                full: "приукрасить"
            }

        ];



        /* =====================================
           СОСТОЯНИЕ
        ===================================== */

        let currentWord = 0;

        let correctAnswers = 0;

        let wrongAnswers = 0;

        let remainingWords = words.length;

        let locked = false;



        /* =====================================
           ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ
        ===================================== */

        function showScreen(id) {

            document
                .querySelectorAll(".screen")
                .forEach(screen => {

                    screen.classList.remove(
                        "active"
                    );

                });


            document
                .getElementById(id)
                .classList.add("active");

        }



        /* =====================================
           ТЕМЫ
        ===================================== */

        function showTopics() {

            showScreen("topics");

        }



        /* =====================================
           НАЧАЛО
        ===================================== */

        function startTraining() {

            currentWord = 0;

            correctAnswers = 0;

            wrongAnswers = 0;

            remainingWords =
                words.length;

            locked = false;

            updateStats();

            showScreen("training");

            showWord();

        }



        /* =====================================
           ПОКАЗ СЛОВА
        ===================================== */

        function showWord() {

            const word =
                words[currentWord];


            const card =
                document.getElementById(
                    "wordCard"
                );


            const result =
                document.getElementById(
                    "result"
                );


            const buttonE =
                document.getElementById(
                    "buttonE"
                );


            const buttonI =
                document.getElementById(
                    "buttonI"
                );


            card.className =
                "word-card";


            result.innerHTML = "";


            buttonE.className =
                "answer-button";


            buttonI.className =
                "answer-button";


            card.textContent =
                word.before +
                "_" +
                word.after;

        }



        /* =====================================
           ОТВЕТ
        ===================================== */

        function answer(letter) {

            if (locked) {
                return;
            }


            locked = true;


            const word =
                words[currentWord];


            const card =
                document.getElementById(
                    "wordCard"
                );


            const result =
                document.getElementById(
                    "result"
                );


            const buttonE =
                document.getElementById(
                    "buttonE"
                );


            const buttonI =
                document.getElementById(
                    "buttonI"
                );


            /* Уменьшаем оставшиеся */

            remainingWords--;



            /* Показываем слово */

            card.textContent =
                word.before +
                letter +
                word.after;



            /* =================================
               ПРАВИЛЬНО
            ================================= */

            if (
                letter === word.correct
            ) {

                correctAnswers++;


                card.classList.add(
                    "correct"
                );


                if (
                    letter === "е"
                ) {

                    buttonE.classList.add(
                        "correct"
                    );

                } else {

                    buttonI.classList.add(
                        "correct"
                    );

                }

            }



            /* =================================
               НЕПРАВИЛЬНО
            ================================= */

            else {

                wrongAnswers++;


                card.classList.add(
                    "wrong"
                );


                if (
                    letter === "е"
                ) {

                    buttonE.classList.add(
                        "wrong"
                    );


                    buttonI.classList.add(
                        "correct"
                    );

                } else {

                    buttonI.classList.add(
                        "wrong"
                    );


                    buttonE.classList.add(
                        "correct"
                    );

                }


                result.innerHTML = `

                    <div>
                        правильное слово:
                    </div>

                    <div class="correct-word">
                        ${word.full}
                    </div>

                `;

            }



            updateStats();



            /* =================================
               СЛЕДУЮЩЕЕ СЛОВО
            ================================= */

            setTimeout(() => {


                currentWord++;


                if (
                    currentWord >=
                    words.length
                ) {

                    currentWord = 0;

                }


                locked = false;


                showWord();


            }, 1000);

        }



        /* =====================================
           ОБНОВЛЕНИЕ СЧЁТЧИКА
        ===================================== */

        function updateStats() {

            document
                .getElementById(
                    "correctCount"
                )
                .textContent =
                correctAnswers;


            document
                .getElementById(
                    "wrongCount"
                )
                .textContent =
                wrongAnswers;


            document
                .getElementById(
                    "remainingCount"
                )
                .textContent =
                remainingWords;

        }


    </script>


</body>

</html>
