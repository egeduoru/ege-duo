            // Перезапускаем анимацию каждый раз, даже при быстрых двойных нажатиях.
            trainingScreen.classList.remove("cycle-shake");
            void trainingScreen.offsetWidth;
            trainingScreen.classList.add("cycle-shake");
            setTimeout(() => trainingScreen.classList.remove("cycle-shake"), 460);

            nextWord();
            // После сброса начинаем новый отсчёт с нуля.
            startTimer();
        }
    }

    async function enableShakeDetection() {

        if (shakeListenerAttached || !isTrainingActive) {
            return;
        }

        // iOS требует явного разрешения на датчики движения.
        if (
            typeof DeviceMotionEvent !== "undefined" &&
            typeof DeviceMotionEvent.requestPermission === "function"
        ) {
            try {
                const permission = await DeviceMotionEvent.requestPermission();
                if (permission !== "granted") {
                    return;
                }
            } catch (error) {
                console.warn("Не удалось получить доступ к датчику движения", error);
                return;
            }
        }

        if (typeof DeviceMotionEvent === "undefined") {
            return;
        }

        window.addEventListener("devicemotion", handleDeviceMotion, { passive: true });
        shakeListenerAttached = true;
    }

    function triggerHaptic(style = "medium") {
        if (!vibrationEnabled) {
            return;
        }

        let telegramHapticUsed = false;

        // В Telegram Mini App используем официальный HapticFeedback API.
        // Вызываем его через уже сохранённый объект tg и защищаем вызов от
        // ошибок, чтобы при проблемах Telegram автоматически сработал
        // стандартный navigator.vibrate().
        try {
            const haptic = tg?.HapticFeedback;
            if (haptic && typeof haptic.impactOccurred === "function") {
                haptic.impactOccurred(style);
                telegramHapticUsed = true;
            }
        } catch (error) {
            telegramHapticUsed = false;
        }

        if (!telegramHapticUsed &&
            typeof navigator !== "undefined" &&
            typeof navigator.vibrate === "function") {
            navigator.vibrate(style === "light" ? 35 : [45, 35, 45]);
        }
    }

    // Короткая слабая вибрация только при неправильном ответе.
    function triggerWrongHaptic() {
        triggerHaptic("light");
    }


    function handleDeviceMotion(event) {
        if (!isTrainingActive || answerLocked || !currentWord) {
            return;
        }

        // Не определяем направление по одному замеру: акселерометр шумный.
        // Коротко накапливаем горизонтальное движение и выбираем ту сторону,
        // у которой за весь жест была большая суммарная сила.
        const acceleration = event.acceleration || event.accelerationIncludingGravity;
        if (!acceleration) {
            return;
        }

        const x = Number(acceleration.x) || 0;
        const now = Date.now();

        if (Math.abs(x) >= SHAKE_THRESHOLD) {
            if (shakeGestureStart === 0) {
                shakeGestureStart = now;
                shakePositive = 0;
                shakeNegative = 0;
            }

            // Интегрируем модуль движения по короткому окну, чтобы единичный
            // шумовой пик не смог изменить направление.
            if (x > 0) {
                shakePositive += Math.abs(x);
            } else {
                shakeNegative += Math.abs(x);
            }
        }

        if (shakeGestureStart === 0) {
            return;
        }

        const gestureAge = now - shakeGestureStart;
        const enoughMovement = shakePositive + shakeNegative >= SHAKE_TOTAL_THRESHOLD;
        const gestureFinished = gestureAge >= SHAKE_GESTURE_WINDOW;

        if (!enoughMovement && !gestureFinished) {
            return;
        }

        const positive = shakePositive;
        const negative = shakeNegative;
        shakeGestureStart = 0;
        shakePositive = 0;
        shakeNegative = 0;

        if (now - lastShakeTime < SHAKE_COOLDOWN) {
            return;
        }

        // Если движения в обе стороны почти одинаковые, жест неоднозначный —
        // лучше не выбирать случайный ответ.
        const difference = Math.abs(positive - negative);
        const total = positive + negative;
        if (total < SHAKE_TOTAL_THRESHOLD || difference < total * SHAKE_DIRECTION_MARGIN) {
            return;
        }

        lastShakeTime = now;

        const visibleButtons = answerButtons.filter(
            button => button.style.display !== "none"
        );

        if (visibleButtons.length < 2) {
            return;
        }

        // Большая накопленная сила определяет направление: вправо — первая
        // кнопка, влево — вторая, как в предыдущей логике приложения.
        const selectedButton = positive > negative
            ? visibleButtons[0]
            : visibleButtons[1];

        const selectedLetter = selectedButton.dataset.letter;
        if (selectedLetter === undefined) {
            return;
        }

        triggerHaptic();
        checkAnswer(selectedLetter);
    }

    function handleTrainingFreeFieldTap(event) {

        if (!isTrainingActive) {
            return;
        }

        // Двойное нажатие по кнопкам не должно сбрасывать тренировку.
        if (event.target.closest("button, a, input, select, textarea, .answer-buttons")) {
            return;
        }

        const now = Date.now();
        const x = event.clientX || 0;
        const y = event.clientY || 0;
        const timeDelta = now - lastFreeTapTime;
        const distance = Math.hypot(x - lastFreeTapX, y - lastFreeTapY);

        if (timeDelta <= DOUBLE_TAP_DELAY && distance <= DOUBLE_TAP_DISTANCE) {
            lastFreeTapTime = 0;
            lastFreeTapX = 0;
            lastFreeTapY = 0;

            triggerHaptic();
            resetCurrentTopicCycleByShake();
            return;
        }

        lastFreeTapTime = now;
        lastFreeTapX = x;
        lastFreeTapY = y;
    }


    trainingScreen.addEventListener("pointerup", handleTrainingFreeFieldTap);


    /*
       Отдельный обработчик свайпа внутри trainingScreen здесь не нужен.
       Общий document-level обработчик выше уже обрабатывает все экраны.
       Два обработчика одновременно могли выполнить переход назад дважды.
    */


/* =========================================================
       НАЧАЛО ТРЕНИРОВКИ
       ========================================================= */

    function startTraining(wordSet = words) {

        cancelPendingNextWord();

        if (completedTopicResetTimer) {
            clearTimeout(completedTopicResetTimer);
            completedTopicResetTimer = null;
        }

        currentTopicKey = topicKeys.get(wordSet) || "prePri";
        isTrainingActive = true;
        enableShakeDetection();

        const saved = loadProgress(currentTopicKey);

        if (saved) {
            correctCount = saved.correctCount;
            wrongCount = saved.wrongCount;
            currentRoundNumber = saved.currentRoundNumber;
            currentWordSet = saved.wordSet;
            activeWords = saved.activeWords;
            delayedWords = saved.delayedWords;
            currentWord = saved.currentWord;
            currentWordWasPreviouslyWrong = saved.currentWordWasPreviouslyWrong;
            resumeAfterAnswer = saved.resumeAfterAnswer;
            answerLocked = false;
            timerElapsedMs = saved.timerElapsedMs || 0;
            timerStartedAt = 0;
            updateTimerDisplay();

            /*
               Для N20 сохраняем текущее задание и выбранные жёлтые
               номера при выходе из тренировки. Поэтому после повторного
               входа пользователь возвращается ровно к той же попытке.
            */
            if (currentTopicKey === "n20" && currentWord && !currentWordWasPreviouslyWrong) {
                updateStats();
                showScreen(trainingScreen);
                renderWord(currentWord);

                n20NumberButtons.forEach(button => {
                    if (saved.selectedN20.includes(button.dataset.letter)) {
                        button.classList.add("selected");
                    }
                });

                saveProgress();
                startTimer();
                return;
            }

            /*
               Для остальных случаев сохраняем прежнюю логику:
               незавершённое слово не показываем повторно.
            */
            if (currentWord) {
                if (currentWordWasPreviouslyWrong) {
                    currentWord = null;
                } else {
                    const alreadyActive = activeWords.includes(currentWord);
                    const alreadyDelayed = delayedWords.some(
                        item => item.word === currentWord
                    );

                    if (!alreadyActive && !alreadyDelayed) {
                        activeWords.push(currentWord);
                    }

                    currentWord = null;
                }
            }

            currentWordWasPreviouslyWrong = false;
            resumeAfterAnswer = false;

            updateStats();
            showScreen(trainingScreen);
            nextWord();
            startTimer();

            return;
        }

        correctCount = 0;

        wrongCount = 0;

        currentRoundNumber = 0;

        answerLocked = false;
        resumeAfterAnswer = false;


        /*
           Создаём независимую копию массива.

           Исходный набор слов никогда не изменяется.
        */

        currentWordSet = wordSet;
        activeWords = [...wordSet];

        delayedWords = [];

        currentWord = null;
        currentWordWasPreviouslyWrong = false;
        resetTimer();


        /*
           Перемешиваем все слова.
        */

        shuffle(activeWords);


        updateStats();

        showScreen(trainingScreen);

        nextWord();
        startTimer();

    }


    /* =========================================================
       RANDOM SHUFFLE
       ========================================================= */

    function shuffle(array) {

        for (
            let i = array.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(Math.random() * (i + 1));

            [
                array[i],
                array[j]
            ] =
            [
                array[j],
                array[i]
            ];

        }

        return array;
    }


    /* =========================================================
       СЛУЧАЙНОЕ ЧИСЛО 10–20
       ========================================================= */

    function randomDelay() {

        return Math.floor(
            Math.random() * 11
        ) + 10;

    }


    /* =========================================================
       СЛЕДУЮЩЕЕ СЛОВО
       ========================================================= */

    function nextWord() {

        answerLocked = false;

        resetButtons();

        clearResult();


        /*
           Если больше нет активных слов
           и нет отложенных —
           тренировка закончена.
        */

        if (
            activeWords.length === 0 &&
            delayedWords.length === 0
        ) {

            finishTraining();

            return;

        }


        currentRoundNumber++;


        /*
           Если обычные задания закончились,
           переходим в режим повторения ошибок.

           В этом режиме показываем ТОЛЬКО те слова,
           на которых раньше была ошибка. Задержка
           между ними больше не нужна.
        */

        if (activeWords.length === 0 && delayedWords.length > 0) {

            /*
               Режим повторения только ошибок.

               Если ошибочных слов несколько, нельзя сразу
               показывать то же самое слово, на котором была
               только что допущена ошибка. Сначала формируем
               список всех других ошибочных слов и выбираем
               следующее случайно из него.

               Если ошибочное слово осталось всего одно,
               повторить именно его неизбежно — других вариантов
               просто нет.
            */
            let repeatCandidates = delayedWords;

            if (delayedWords.length > 1 && currentWord) {
                repeatCandidates = delayedWords.filter(
                    item => item.word !== currentWord
                );
            }

            const randomIndex = Math.floor(
                Math.random() * repeatCandidates.length
            );

            currentWord =
                repeatCandidates[randomIndex].word;

            currentWordWasPreviouslyWrong = true;

            renderWord(currentWord);
            updateStats();
            saveProgress();

            return;
        }


        /*
           Пока есть обычные задания,
           отложенные ошибки ждут своего повтора.
        */

        for (
            const item of delayedWords
        ) {

            item.delay--;

        }


        /*
           Слова, которым уже пора возвращаться.
        */

        const readyWords =
            delayedWords.filter(
                item => item.delay <= 0
            );


        /*
           ВАЖНО: готовое слово не удаляем из delayedWords до
           момента правильного ответа. Оно всё ещё считается
           нерешённым, поэтому должно входить в "Всего".
           После ошибки checkAnswer() заново поставит его
           в delayedWords с новой задержкой, а после правильного
           ответа removeFromDelayedWords() удалит его окончательно.
        */

        let selectedWord = null;


        /*
           Если есть слово, которое пора вернуть,
           выбираем одно случайное.
        */

        if (readyWords.length > 0) {

            const randomIndex =
                Math.floor(
                    Math.random() *
                    readyWords.length
                );

            selectedWord =
                readyWords[randomIndex].word;

            currentWordWasPreviouslyWrong = true;


            /*
               Все готовые слова уже остаются в delayedWords.
               Выбранное тоже остаётся там до ответа, чтобы
               "Всего" не уменьшалось просто из-за показа слова.
            */

        }


        /*
           Если готового слова нет,
           берём случайное из активных.
        */

        if (!selectedWord) {

            if (activeWords.length > 0) {

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        activeWords.length
                    );

                selectedWord =
                    activeWords[randomIndex];

                currentWordWasPreviouslyWrong = false;

            }

        }


        /*
           Теоретически selectedWord
           всегда должен существовать.
        */

        if (!selectedWord) {

            finishTraining();

            return;

        }


        currentWord = selectedWord;
        resumeAfterAnswer = false;

        renderWord(currentWord);
        saveProgress();

    }


    /* =========================================================
       ОТОБРАЖЕНИЕ СЛОВА
       ========================================================= */

    function renderWord(word) {

        if (isN20Task(word)) {
            wordElement.classList.add("n20-fit");
            wordElement.innerHTML =
                `<span class="word-main">${escapeHtml(word.text || word.full || "")}</span>`;
            configureAnswerButtons(word.options);
            fitTaskText();
            return;
        }

        wordElement.classList.remove("n20-fit");
        wordArea.classList.remove("n20-layout");
        wordArea.style.position = "";
        wordArea.style.top = "";
        wordArea.style.height = "";
        wordArea.style.minHeight = "";
        wordArea.style.left = "";
        wordArea.style.width = "";
        wordElement.style.width = "";
        wordElement.style.maxWidth = "";
        wordElement.style.height = "";
        wordElement.style.minHeight = "";
        wordElement.style.fontSize = "";

        const newHtml =
            `<span class="word-switch-new"><span class="word-main">${escapeHtml(word.before)}<span class="missing">_</span>${escapeHtml(word.after)}</span>` +
            (word.note
                ? `<span class="word-note">${escapeHtml(word.note)}</span>`
                : "") +
            `</span>`;

        const previous = wordElement.querySelector(".word-switch-new");

        if (previous) {
            const previousHtml = previous.outerHTML;
            wordElement.innerHTML =
                `<span class="word-switch-old">${previousHtml}</span>${newHtml}`;

            const oldLayer = wordElement.querySelector(".word-switch-old");
            oldLayer?.addEventListener("animationend", () => {
                oldLayer.remove();
            }, { once: true });
        } else {
            wordElement.innerHTML = newHtml;
        }

        configureAnswerButtons(word.options);
    }

    /* =========================================================
       АДАПТИВНЫЙ РАЗМЕР ТЕКСТА ЗАДАНИЯ
       ========================================================= */

    function fitTaskText() {
        if (!currentWord || !isN20Task()) return;

        const topRect = trainingTop.getBoundingClientRect();
        const statsRect = statsElement.getBoundingClientRect();
        const bottomRect = document.querySelector(".training-bottom").getBoundingClientRect();

        // Строгое пространство между счётчиками и кнопками.
        // Одинаковый зазор сверху и снизу = текст по центру.
        const edgeGap = 18;
        const safeTop = statsRect.bottom + edgeGap;
        const safeBottom = bottomRect.top - edgeGap;
        const safeHeight = Math.max(120, safeBottom - safeTop);

        // Максимально возможная область текста: почти вся ширина экрана,
        // но с безопасными боковыми полями. Чем больше доступная область,
        // тем меньше приходится уменьшать шрифт.
        const safeWidth = Math.max(240, Math.min(
            topRect.width * 0.90,
            900,
            window.innerWidth * 0.90
        ));

        wordArea.classList.add("n20-layout");
        wordArea.style.position = "absolute";
        wordArea.style.left = "0px";
        wordArea.style.top = `${safeTop - topRect.top}px`;
        wordArea.style.width = `${topRect.width}px`;
        wordArea.style.height = `${safeHeight}px`;
        wordArea.style.minHeight = `${safeHeight}px`;

        // Результат получает отдельную нижнюю область.
        // Поэтому текст никогда не может оказаться под результатом.
        // Сначала резервируем место под две строки результата,
        // а оставшееся пространство полностью отдаём заданию.
        const resultReserve = 54;
        const textHeight = Math.max(100, safeHeight - resultReserve);

        wordElement.style.width = `${safeWidth}px`;
        wordElement.style.maxWidth = `${safeWidth}px`;
        wordElement.style.height = `${safeHeight}px`;
        wordElement.style.minHeight = `${safeHeight}px`;
        wordElement.style.fontSize = "64px";

        // Находим максимально крупный шрифт, который реально помещает
        // весь текст и по ширине, и по высоте.
        let low = 24;
        let high = 64;
        let best = 24;

        for (let i = 0; i < 12; i++) {
            const mid = (low + high) / 2;
            wordElement.style.fontSize = `${mid}px`;

            const main = wordElement.querySelector(".word-main");
            const fitsWidth = main ? main.scrollWidth <= safeWidth + 1 : true;
            const fitsHeight = wordElement.scrollHeight <= textHeight + 1;

            if (fitsWidth && fitsHeight) {
                best = mid;
                low = mid;
            } else {
                high = mid;
            }
        }

        wordElement.style.fontSize = `${Math.floor(best * 10) / 10}px`;
    }

    function scheduleTaskTextFit() {
        if (!currentWord || !isN20Task()) return;
        requestAnimationFrame(() => requestAnimationFrame(fitTaskText));
    }

    window.addEventListener("resize", scheduleTaskTextFit);
    window.addEventListener("orientationchange", () => {
        setTimeout(scheduleTaskTextFit, 80);
    });

    if (window.ResizeObserver) {
        const trainingObserver = new ResizeObserver(() => {
            if (currentWord && isN20Task()) {
                scheduleTaskTextFit();
            }
        });
        trainingObserver.observe(trainingTop);
        trainingObserver.observe(wordElement);
    }

    function isN20Task(word = currentWord) {
        return currentTopicKey === "n20" && word?.task_id?.startsWith("n20_");
    }

    function getN20SelectedAnswer() {
        return n20NumberButtons
            .filter(button => button.classList.contains("selected"))
            .map(button => button.dataset.letter)
            .join("");
    }

    function checkN20Answer() {
        if (answerLocked || !currentWord || !isN20Task()) return;

        const selected = getN20SelectedAnswer();

        // Нельзя подтвердить пустой ответ.
        if (!selected) {
            triggerHaptic();
            return;
        }

        const correct = String(currentWord.correct);
        const selectedSet = new Set(selected.split(""));
        const correctSet = new Set(correct.split(""));

        // Порядок нажатия не должен влиять на ответ: сравниваем
        // именно набор выбранных номеров.
        const isCorrect =
            selectedSet.size === correctSet.size &&
            [...selectedSet].every(digit => correctSet.has(digit));

        answerLocked = true;

        n20NumberButtons.forEach(button => {
            const digit = button.dataset.letter;
            button.classList.remove("selected");

            if (correctSet.has(digit) && selectedSet.has(digit)) {
                // Номер одновременно правильный и выбранный — зелёный.
                button.classList.add("correct-answer");
            } else if (correctSet.has(digit) || selectedSet.has(digit)) {
                // Если правильный номер НЕ выбран — он тоже считается ошибкой.
                // Если выбран лишний номер — он также считается ошибкой.
                button.classList.add("wrong-answer");
            }

            button.classList.add("disabled");
        });

        if (isCorrect) {
            const solvedWord = currentWord;

            if (!currentWordWasPreviouslyWrong) {
                correctCount++;
            }

            removeFromActiveWords(currentWord);
            removeFromDelayedWords(currentWord);
            updateStats();

            currentWord = null;
            currentWordWasPreviouslyWrong = false;
            resumeAfterAnswer = true;
            saveProgress();

            resultElement.className = "result correct-result";
            resultLabel.textContent = "Правильно";
            resultWord.textContent = `Верные: ${correct.split("").join(", ")}; Неверные: —`;
        } else {
            if (!currentWordWasPreviouslyWrong) {
                wrongCount++;
            }

            removeFromActiveWords(currentWord);
            removeFromDelayedWords(currentWord);
            delayedWords.push({ word: currentWord, delay: randomDelay() });
            currentWordWasPreviouslyWrong = true;
            resumeAfterAnswer = true;

            updateStats();
            saveProgress();

            triggerWrongHaptic();

        resultElement.className = "result wrong-result";
            resultLabel.textContent = "Неправильно";
            // Разделяем ошибку на три случая:
            // 1) пользователь только не выбрал нужные цифры -> «Не хватает»;
            // 2) пользователь только выбрал лишние цифры -> «Перебор»;
            // 3) есть и пропущенные, и лишние -> обычное «Неверные».
            const missingDigits = [...correctSet]
                .filter(digit => !selectedSet.has(digit))
                .sort((a, b) => Number(a) - Number(b));

            const extraDigits = [...selectedSet]
                .filter(digit => !correctSet.has(digit))
                .sort((a, b) => Number(a) - Number(b));

            const rightDigits = [...selectedSet]
                .filter(digit => correctSet.has(digit))
                .sort((a, b) => Number(a) - Number(b));

            let errorLabel = "Неверные";
            let errorDigits = [...new Set([...extraDigits, ...missingDigits])]
                .sort((a, b) => Number(a) - Number(b));

            if (missingDigits.length > 0 && extraDigits.length === 0) {
                errorLabel = "Не хватает";
                errorDigits = missingDigits;
            } else if (extraDigits.length > 0 && missingDigits.length === 0) {
                errorLabel = "Перебор";
                errorDigits = extraDigits;
            }

            if (errorLabel === "Перебор") {
                resultWord.textContent = `Верные: ${rightDigits.join(", ") || "—"}; Перебор: ${errorDigits.join(", ")}`;
            } else if (errorLabel === "Не хватает") {
                resultWord.textContent = `Верные: ${rightDigits.join(", ") || "—"}; Не хватает: ${errorDigits.join(", ")}`;
            } else {
                resultWord.textContent = `Верные: ${rightDigits.join(", ") || "—"}; Неверные: ${errorDigits.join(", ") || "—"}`;
            }

            sendWrongAnswer(currentWord.full || currentWord.text || "");
        }

        // Для N20 даём примерно в два раза больше времени на просмотр результата.
        scheduleNextWord(2000);
    }

    function configureAnswerButtons(options) {

        const n20 = isN20Task();
        const labels = options || ["е", "и"];

        answerButtonsContainer.classList.toggle("n20-mode", n20);
        answerButtonsContainer.classList.toggle(
            "three-buttons",
            !n20 && labels.length === 3
        );

        n20NumberButtons.forEach(button => {
            button.style.display = n20 ? "flex" : "none";
            button.classList.remove("selected", "correct-answer", "wrong-answer", "disabled");
        });
        n20Submit.style.display = n20 ? "flex" : "none";
        n20Submit.classList.remove("correct-answer", "wrong-answer", "disabled");

        answerButtons.forEach((button, index) => {

            const option = labels[index];

            button.classList.remove(
                "correct-answer",
                "wrong-answer",
                "disabled"
            );

            if (n20 || option === undefined) {
                button.style.display = "none";
                return;
            }

            button.style.display = "flex";
            button.dataset.letter = option;
            button.textContent = option === "" ? "" : option.toUpperCase();
            button.setAttribute(
                "aria-label",
                option === "" ? "пусто" : option.toUpperCase()
            );
        });
    }


    /* =========================================================
       ОТВЕТ
       ========================================================= */

    answerButtons.forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    if (answerLocked) {
                        return;
                    }

                    if (!currentWord) {
                        return;
                    }

                    if (isN20Task()) {
                        button.classList.toggle("selected");
                        saveProgress();
                        return;
                    }

                    const selectedLetter =
                        button.dataset.letter;

                    checkAnswer(
                        selectedLetter
                    );

                }
            );

        }
    );


    // N20: отдельная кнопка подтверждения выбранных позиций.
    n20NumberButtons.forEach(button => {
        button.addEventListener("click", () => {
            if (answerLocked || !currentWord || !isN20Task()) return;
            button.classList.toggle("selected");
            saveProgress();
        });
    });

    n20Submit.addEventListener("click", () => {
        checkN20Answer();
    });


    /* =========================================================
       ПРОВЕРКА
       ========================================================= */

    function checkAnswer(letter) {

        answerLocked = true;


        /*
           Сразу вставляем выбранную букву.
        */

        const visibleLetter =
            letter === "" || letter === "/"
                ? ""
                : letter;

        wordElement.innerHTML =
            `<span class="word-main">${escapeHtml(currentWord.before)}<span class="missing">${escapeHtml(visibleLetter)}</span>${escapeHtml(currentWord.after)}</span>` +
            (currentWord.note
                ? `<span class="word-note">${escapeHtml(currentWord.note)}</span>`
                : "");


        const isCorrect =
            letter === currentWord.correct;


        /*
           Находим кнопку правильного ответа.
        */

        const correctButton =
            answerButtons.find(
                button =>
                    button.dataset.letter ===
                    currentWord.correct
            );


        /*
           Находим выбранную кнопку.
        */

        const selectedButton =
            answerButtons.find(
                button =>
                    button.dataset.letter ===
                    letter
            );


        if (isCorrect) {

            /* =========================
               ПРАВИЛЬНО
            ========================= */

            // Сохраняем текущее задание до его удаления/обнуления.
            // Ниже это слово ещё нужно показать в результате.
            const solvedWord = currentWord;

            /*
               Если слово уже было ошибочным и сейчас
               решено правильно на повторе, счётчики
               "Верно" и "Неверно" НЕ меняются.
               Меняется только "Всего".
            */

            if (!currentWordWasPreviouslyWrong) {
                correctCount++;
            }


            selectedButton
                ?.classList.add(
                    "correct-answer"
                );


            /*
               Удаляем слово навсегда
               из текущего цикла.
            */

            removeFromActiveWords(
                currentWord
            );

            removeFromDelayedWords(
                currentWord
            );

            /*
               Теперь пересчитываем "Всего" уже ПОСЛЕ
               удаления задания. Поэтому число сразу
               уменьшается на 1.
            */
            updateStats();

            /*
               Сохраняем именно новое состояние.
               Старое currentWord больше не должно
               возвращаться при повторном открытии темы.
            */
            currentWord = null;
            currentWordWasPreviouslyWrong = false;
            resumeAfterAnswer = true;
            saveProgress();


            resultElement.className =
                "result correct-result";

            resultLabel.textContent =
                "✓ Правильно";

            resultWord.innerHTML =
                `${escapeHtml(solvedWord.full.replace(/ \([^)]*\)$/, ""))}` +
                (solvedWord.note
                    ? `<span class="result-word-note">${escapeHtml(solvedWord.note)}</span>`
                    : "");


            scheduleNextWord(1000);

        } else {

            /* =========================
               ОШИБКА
            ========================= */

            /*
               Ошибка учитывается только один раз для задания.
               Если это повтор уже ошибочного слова,
               "Неверно" больше не увеличивается.
            */

            if (!currentWordWasPreviouslyWrong) {
                wrongCount++;
            }

            updateStats();


            selectedButton
                ?.classList.add(
                    "wrong-answer"
                );


            correctButton
                ?.classList.add(
                    "correct-answer"
                );


            resultElement.className =
                "result wrong-result";


            resultLabel.textContent =
                "правильное слово:";


            resultWord.innerHTML =
                `${escapeHtml(currentWord.full.replace(/ \([^)]*\)$/, ""))}` +
                (currentWord.note
                    ? `<span class="result-word-note">${escapeHtml(currentWord.note)}</span>`
                    : "");


            /*
               Слово остаётся незавершённым.

               Откладываем его на 10–20
               других слов.
            */

            /*
               Любая ошибка оставляет слово нерешённым.
               Для первого ошибочного ответа переносим его из
               activeWords в delayedWords. Для повторной ошибки
               слово могло быть временно выбрано из delayedWords,
               поэтому тоже заново ставим его в очередь с новой
               задержкой. Это не даёт слову исчезнуть из "Всего".
            */
            removeFromActiveWords(
                currentWord
            );

            removeFromDelayedWords(
                currentWord
            );

            delayedWords.push({
                word: currentWord,
                delay: randomDelay()
            });

            currentWordWasPreviouslyWrong = true;

            resumeAfterAnswer = true;
            saveProgress();


            /*
               Отправляем ошибку backend.
               
               Важно:
               fetch НЕ закрывает Mini App.
            */

            sendWrongAnswer(
                currentWord.full
            );


            /*
               Через одну секунду
               переходим дальше.
            */

            scheduleNextWord(1000);

        }

    }


    /* =========================================================
       ОТПРАВКА ОШИБКИ BACKEND
       ========================================================= */

    async function sendWrongAnswer(word) {

        /*
           Если backend пока не указан —
           просто ничего не делаем.

           Само приложение продолжает работать.
        */

        if (!API_URL) {

            console.log(
                "Backend пока не подключён:",
                word
            );

            return;

        }


        try {

            const response =
                await fetch(
                    API_URL,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            word: word,

                            /*
                               Telegram передаёт
                               подписанные initData.

                               Backend сможет проверить,
                               что запрос действительно
                               пришёл от Telegram.
                            */

                            initData:
                                tg.initData

                        })

                    }
                );


            if (!response.ok) {

                console.error(
                    "Backend error:",
                    response.status
                );

                return;

            }


            const data =
                await response.json();


            console.log(
                "Ошибка отправлена:",
                data
            );


        } catch (error) {

            console.error(
                "Не удалось отправить ошибку:",
                error
            );

        }

    }


    /* =========================================================
       УДАЛИТЬ ИЗ ACTIVE
    ========================================================= */

    function removeFromActiveWords(word) {

        activeWords =
            activeWords.filter(
                item =>
                    item !== word
            );

    }


    /* =========================================================
       УДАЛИТЬ ИЗ DELAYED
    ========================================================= */

    function removeFromDelayedWords(word) {

        delayedWords =
            delayedWords.filter(
                item =>
                    item.word !== word
            );

    }


    /* =========================================================
       СТАТИСТИКА
    ========================================================= */

    function updateStats() {

        correctStat.textContent =
            `Верно: ${correctCount}`;


        wrongStat.textContent =
            `Неверно: ${wrongCount}`;


        /*
           Всего =
           количество уникальных слов,
           которые ещё не были решены правильно.

           Поэтому при ошибке оно НЕ уменьшается.

           При правильном ответе уменьшается.
        */

        const remaining =
            activeWords.length +
            delayedWords.length;


        totalStat.textContent =
            `Всего: ${remaining}`;

        updateTimerDisplay();

    }


    /* =========================================================
       ВАЖНО:
       После изменения delayedWords
       статистику нужно обновить.
    ========================================================= */

    function updateRemainingStat() {

        const remaining =
            activeWords.length +
            delayedWords.length;

        totalStat.textContent =
            `Всего: ${remaining}`;

    }


    /* =========================================================
       РЕЗУЛЬТАТ
    ========================================================= */

    function clearResult() {

        resultElement.className =
            "result";

        resultLabel.textContent =
            "";

        resultWord.innerHTML =
            "";

    }


    /* =========================================================
       КНОПКИ
    ========================================================= */

    function resetButtons() {

        answerButtons.forEach(
            button => {

                button.classList.remove(
                    "correct-answer",
                    "wrong-answer",
                    "disabled",
                    "selected"
                );

            }
        );

        n20NumberButtons.forEach(button => {
            button.classList.remove(
                "correct-answer",
                "wrong-answer",
                "disabled",
                "selected"
            );
        });

        n20Submit.classList.remove(
            "correct-answer",
            "wrong-answer",
            "disabled",
            "selected"
        );
    }


    /* =========================================================
       ЗАВЕРШЕНИЕ
    ========================================================= */

    let completedTopicResetTimer = null;

    function finishTraining() {

        answerLocked = true;
        pauseTimer();
        stopTimerTicker();

        resetButtons();


        wordElement.textContent =
            "🎉";


        resultElement.className =
            "result correct-result";


        resultLabel.textContent =
            "Тренировка завершена";


        resultWord.textContent = timerEnabled
            ? `Верно: ${correctCount} • Неверно: ${wrongCount} • Время: ${formatTimer(timerElapsedMs)}`
            : `Верно: ${correctCount} • Неверно: ${wrongCount}`;


        updateStats();


        /*
           Если все задания темы решены правильно
           и осталось 0 заданий, через 5 секунд
           полностью восстанавливаем тему.
        */

        if (
            activeWords.length === 0 &&
            delayedWords.length === 0
        ) {

            // Полностью завершённая тема засчитывается в дневную норму.
            markTopicCompletedForToday(currentTopicKey);

            if (completedTopicResetTimer) {
                clearTimeout(completedTopicResetTimer);
            }

            const completedTopicKey = currentTopicKey;

            completedTopicResetTimer = setTimeout(
                () => {

                    /*
                       Если пользователь уже перешёл
                       в другую тему, старый таймер
                       не должен менять её состояние.
                    */

                    if (currentTopicKey !== completedTopicKey) {
                        return;
                    }

                    currentWordSet =
                        completedTopicKey === "dictionary"
                            ? dictionaryWords
                            : (completedTopicKey === "n20" ? n20Words : words);

                    activeWords = [...currentWordSet];
                    delayedWords = [];
                    currentWord = null;
                    currentWordWasPreviouslyWrong = false;
                    currentRoundNumber = 0;
                    resumeAfterAnswer = false;
                    answerLocked = false;

                    // Новый цикл темы начинается с чистой статистикой.
                    correctCount = 0;
                    wrongCount = 0;
                    resetTimer();

                    // Сохраняем уже сброшенное состояние, чтобы
                    // следующий запуск не вернул старые значения.
                    saveProgress();
                    updateStats();
                    nextWord();

                    // После автоматического начала нового цикла таймер тоже
                    // должен снова запуститься с нуля, если он включён.
                    startTimer();

                    completedTopicResetTimer = null;

                },
                5000
            );

        }

    }


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    // Обновляем огонёк при каждом открытии приложения.
    refreshStreakForToday();


    /* =========================================================
       TELEGRAM THEME
    ========================================================= */

    if (
        tg.themeParams &&
        tg.themeParams.bg_color
    ) {

        /*
           Ничего специально не меняем:
           дизайн приложения остаётся
           синим/белым.
        */

    }


</script>
